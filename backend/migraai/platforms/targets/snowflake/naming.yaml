target: snowflake
identifier_case: upper
quote_char: '"'
max_identifier_length: 255
qualification: three_part
reserved_words:
  - "ACCOUNT"
  - "ALL"
  - "ALTER"
  - "AND"
  - "ANY"
  - "AS"
  - "BETWEEN"
  - "BY"
  - "CASE"
  - "CAST"
  - "CHECK"
  - "COLUMN"
  - "CONNECT"
  - "CONNECTION"
  - "CONSTRAINT"
  - "CREATE"
  - "CROSS"
  - "CURRENT"
  - "CURRENT_DATE"
  - "CURRENT_TIME"
  - "CURRENT_TIMESTAMP"
  - "CURRENT_USER"
  - "DATABASE"
  - "DELETE"
  - "DISTINCT"
  - "DROP"
  - "ELSE"
  - "EXISTS"
  - "FALSE"
  - "FOLLOWING"
  - "FOR"
  - "FROM"
  - "FULL"
  - "GRANT"
  - "GROUP"
  - "HAVING"
  - "ILIKE"
  - "IN"
  - "INCREMENT"
  - "INNER"
  - "INSERT"
  - "INTERSECT"
  - "INTO"
  - "IS"
  - "ISSUE"
  - "JOIN"
  - "LATERAL"
  - "LEFT"
  - "LIKE"
  - "LOCALTIME"
  - "LOCALTIMESTAMP"
  - "MINUS"
  - "NATURAL"
  - "NOT"
  - "NULL"
  - "OF"
  - "ON"
  - "OR"
  - "ORDER"
  - "ORGANIZATION"
  - "QUALIFY"
  - "REGEXP"
  - "REVOKE"
  - "RIGHT"
  - "RLIKE"
  - "ROW"
  - "ROWS"
  - "SAMPLE"
  - "SCHEMA"
  - "SELECT"
  - "SET"
  - "SOME"
  - "START"
  - "TABLE"
  - "TABLESAMPLE"
  - "THEN"
  - "TO"
  - "TRIGGER"
  - "TRUE"
  - "TRY_CAST"
  - "UNION"
  - "UNIQUE"
  - "UPDATE"
  - "USING"
  - "VALUES"
  - "VIEW"
  - "WHEN"
  - "WHENEVER"
  - "WHERE"
  - "WINDOW"
  - "WITH"
claims:
  - text: Snowflake stores and resolves unquoted identifiers in uppercase, double-quoted identifiers are case-sensitive, and identifiers can be up to 255 characters long.
    url: https://docs.snowflake.com/en/sql-reference/identifiers-syntax
    accessed: 2026-10-15
    confidence: high
  - text: Snowflake objects can be referenced with fully qualified database.schema.object names.
    url: https://docs.snowflake.com/en/sql-reference/name-resolution
    accessed: 2026-10-15
    confidence: high
  - text: Snowflake SQL reserves all ANSI keywords except type keywords, plus additional keywords such as MINUS, REGEXP, RLIKE and SOME, and restricts others such as LEFT and JOIN as table names or aliases.
    url: https://docs.snowflake.com/en/sql-reference/reserved-keywords
    accessed: 2026-10-15
    confidence: high
