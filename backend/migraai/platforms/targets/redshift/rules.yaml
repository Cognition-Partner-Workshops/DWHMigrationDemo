target: redshift
rules:
  - id: redshift.lint.no_select_star_in_view
    check: lint
    languages: [sql]
    object_types: [view]
    kind: forbid_regex
    pattern: '(?is)\bcreate\s+(?:or\s+replace\s+)?view\b[^;]*\bselect\s+\*'
    severity: error
    message: Views must list their columns explicitly.
    replacement: Replace SELECT * with the explicit column list.
  - id: redshift.lint.identity_requires_int_or_bigint
    check: lint
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\b(?:smallint|int2|decimal|numeric)(?:\s*\([^)]*\))?\s+(?:generated\s+by\s+default\s+as\s+)?identity\s*\('
    severity: error
    message: Redshift IDENTITY columns must be INT or BIGINT.
    replacement: Declare the IDENTITY column as BIGINT.
    claim:
      text: The data type for an IDENTITY column must be either INT or BIGINT.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_NEW.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.lint.no_create_index
    check: lint
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bcreate\s+(?:unique\s+)?index\b'
    severity: error
    message: Redshift does not support indexes.
    replacement: Use SORTKEY and DISTKEY instead of indexes.
    claim:
      text: Indexes are listed among the PostgreSQL features that are not supported in Amazon Redshift.
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-features.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.lint.identity_load_order_review
    check: lint
    languages: [sql]
    kind: forbid_regex
    pattern: '(?is)\bidentity\s*\([^)]*\)[^;]*;\s*(?:insert\s+into\s+[\w."]+\s+select|copy\s)'
    severity: warning
    message: IDENTITY values loaded by INSERT ... SELECT or COPY are unique but not ordered and may have gaps.
    claim:
      text: When a table is loaded with INSERT INTO ... SELECT or COPY, Amazon Redshift skips identity values to keep them unique, and the order might not match the source.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_NEW.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.no_unsupported_types
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?im)(?:^|[(,])\s*"?\w+"?\s+(?:serial|bigserial|smallserial|bytea|money|uuid|jsonb?|xml|hstore|inet|cidr|bit\s+varying|\w+\s*\[\s*\])(?=[\s,)])'
    severity: error
    message: Column uses a PostgreSQL data type that Redshift does not support.
    replacement: Use SUPER for JSON, VARCHAR for UUID/XML, VARBYTE for binary, DECIMAL for MONEY and IDENTITY for SERIAL.
    claim:
      text: Arrays, BIT VARYING, BYTEA, HSTORE, JSON, SERIAL/BIGSERIAL/SMALLSERIAL, MONEY, network address types, UUID and XML are PostgreSQL data types not supported in Amazon Redshift.
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-datatypes.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.no_unsupported_functions
    check: rule
    languages: [sql]
    kind: forbid_function
    functions: [string_agg, array_agg, generate_series, regexp_matches, regexp_split_to_table, regexp_split_to_array, clock_timestamp, pg_sleep, transaction_timestamp, width_bucket, overlay]
    severity: error
    message: Query calls a PostgreSQL function that Redshift does not support.
    replacement: Use LISTAGG for STRING_AGG, and REGEXP_SUBSTR or SPLIT_PART for regex splitting.
    claim:
      text: STRING_AGG, ARRAY_AGG, GENERATE_SERIES, REGEXP_MATCHES, REGEXP_SPLIT_TO_TABLE, REGEXP_SPLIT_TO_ARRAY, CLOCK_TIMESTAMP, PG_SLEEP, TRANSACTION_TIMESTAMP, WIDTH_BUCKET and OVERLAY are PostgreSQL functions not supported in Amazon Redshift.
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-functions.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.no_triggers
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bcreate\s+(?:or\s+replace\s+)?(?:constraint\s+)?trigger\b'
    severity: error
    message: Redshift does not support triggers.
    replacement: Move trigger logic into the load procedure or the orchestration step.
    claim:
      text: Triggers are listed among the PostgreSQL features that are not supported in Amazon Redshift.
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-features.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.no_sequences
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bcreate\s+sequence\b|\bnextval\s*\('
    severity: error
    message: Redshift does not support sequences.
    replacement: Use an IDENTITY or GENERATED BY DEFAULT AS IDENTITY column.
    claim:
      text: Sequences are listed among the PostgreSQL features that are not supported in Amazon Redshift.
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-features.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.no_table_partitioning
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bpartition\s+by\s+(?:range|list|hash)\s*\('
    severity: error
    message: Redshift does not support range or list table partitioning.
    replacement: Use a SORTKEY on the partition column, or a Spectrum external table partitioned in S3.
    claim:
      text: Table partitioning (range and list partitioning) is listed among the PostgreSQL features that are not supported in Amazon Redshift.
      url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-features.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.single_column_distkey
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bdistkey\s*\(\s*[^),]+,'
    severity: error
    message: A Redshift table can have only one DISTKEY column.
    replacement: Pick the single most-joined column as DISTKEY.
    claim:
      text: Only one column in a table can be the distribution key.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_NEW.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.diststyle_key_requires_distkey
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?is)\bcreate\s+(?:temp(?:orary)?\s+)?table\b(?![^;]*\bdistkey\b)[^;]*\bdiststyle\s+key\b'
    severity: error
    message: DISTSTYLE KEY requires a DISTKEY column.
    replacement: Add DISTKEY (column) or use DISTSTYLE AUTO.
    claim:
      text: If you specify DISTSTYLE KEY, you must name a DISTKEY column, either for the table or as part of the column definition.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_NEW.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.procedure_plpgsql_body
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?is)\bcreate\s+(?:or\s+replace\s+)?procedure\b[^;$]*?\bas\s+begin\b'
    severity: error
    message: Redshift stored procedures need a dollar-quoted PL/pgSQL body.
    replacement: Write AS $$ ... $$ LANGUAGE plpgsql.
    claim:
      text: Amazon Redshift CREATE PROCEDURE takes a dollar-quoted body and LANGUAGE plpgsql.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_PROCEDURE.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.no_transaction_commands_in_procedure
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?is)\$\$(?:(?!\$\$).)*?\b(?:vacuum|prepare|create\s+external\s+table|(?:create|drop)\s+database|set\s+local|alter\s+table\s+[\w."]+\s+append)\b(?:(?!\$\$).)*\$\$'
    severity: error
    message: This command needs its own transaction context and cannot run inside a Redshift stored procedure.
    replacement: Run the command outside the procedure, for example as a separate orchestration step.
    claim:
      text: SQL commands that need their own transaction context, such as PREPARE, CREATE/DROP DATABASE, CREATE EXTERNAL TABLE, VACUUM, SET LOCAL and ALTER TABLE APPEND, are not supported inside a stored procedure.
      url: https://docs.aws.amazon.com/redshift/latest/dg/stored-procedure-constraints.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.rule.merge_without_with_clause
    check: rule
    languages: [sql]
    kind: forbid_regex
    pattern: '(?is)\bwith\s+\w+\s+as\s*\([^;]*\bmerge\s+into\b'
    severity: error
    message: Redshift MERGE does not accept a WITH clause.
    replacement: Materialise the CTE in a temporary table and MERGE from it.
    claim:
      text: You can't use the WITH clause in a MERGE statement.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_MERGE.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.security.no_plaintext_password
    check: security
    languages: [sql]
    kind: forbid_regex
    pattern: "(?i)\\bpassword\\s+'(?!md5[0-9a-f]{32}'|sha256\\|)[^']*'"
    severity: error
    message: Do not put clear-text passwords in converted code.
    replacement: Use PASSWORD DISABLE with IAM/federated authentication, or a hash supplied at deploy time.
    claim:
      text: CREATE USER accepts a password in clear text, as an MD5 hash or as a SHA256 hash; the MD5 hash is documented as a more secure alternative to passing the password as clear text, and PASSWORD DISABLE removes the password.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_USER.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.security.no_access_keys
    check: security
    languages: [sql, python, json, yaml]
    kind: forbid_regex
    pattern: '(?i)\b(?:access_key_id|secret_access_key|aws_access_key_id|aws_secret_access_key|session_token)\b|\bAKIA[0-9A-Z]{16}\b'
    severity: error
    message: Do not embed AWS access keys; authorize COPY and UNLOAD with IAM_ROLE.
    replacement: Use IAM_ROLE default or an IAM role ARN.
    claim:
      text: COPY authorization is provided by referencing an IAM role attached to the cluster with IAM_ROLE (default, SESSION or a role ARN).
      url: https://docs.aws.amazon.com/redshift/latest/dg/copy-parameters-authorization.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.security.no_grant_all
    check: security
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bgrant\s+all\b'
    severity: error
    message: Do not GRANT ALL; grant only the privileges the role needs.
    replacement: Grant explicit privileges such as SELECT to a role.
    claim:
      text: Role-based access control in Amazon Redshift applies the principle of least permissions to users based on their role requirements.
      url: https://docs.aws.amazon.com/redshift/latest/dg/t_Roles.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.security.no_grant_to_public
    check: security
    languages: [sql]
    kind: forbid_regex
    pattern: '(?is)\bgrant\b[^;]*\bto\s+(?:[^;]*,\s*)?public\b'
    severity: error
    message: Do not grant privileges to PUBLIC.
    replacement: Grant to a named role instead.
    claim:
      text: Redshift GRANT accepts PUBLIC as a grantee alongside users, roles and groups.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_GRANT.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.security.no_with_grant_option
    check: security
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bwith\s+grant\s+option\b'
    severity: error
    message: Do not widen ownership with WITH GRANT OPTION.
    replacement: Keep grant administration with the owning role.
    claim:
      text: Redshift GRANT supports WITH GRANT OPTION for a user grantee, which lets that user grant the privilege to others.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_GRANT.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.security.security_definer_review
    check: security
    languages: [sql]
    kind: forbid_regex
    pattern: '(?i)\bsecurity\s+definer\b'
    severity: warning
    message: SECURITY DEFINER runs the procedure with the owner's privileges; review it.
    claim:
      text: In SECURITY DEFINER mode the procedure uses the privileges of the procedure owner; SECURITY INVOKER is the default.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_PROCEDURE.html
      accessed: 2026-10-15
      confidence: high
  - id: redshift.lint.explicit_diststyle
    check: lint
    languages: [sql]
    kind: require_regex
    pattern: '(?is)\bdiststyle\s+(?:auto|even|key|all)\b|\bdistkey\b|\bcreate\s+temp(?:orary)?\s+table\b|^(?![\s\S]*\bcreate\s+table\b)'
    severity: warning
    message: State DISTSTYLE (or DISTKEY) explicitly so the distribution choice is reviewed; AUTO is the silent default.
    claim:
      text: DISTSTYLE can be AUTO, EVEN, KEY or ALL, and AUTO is the default when no distribution style is specified.
      url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_NEW.html
      accessed: 2026-10-15
      confidence: high
