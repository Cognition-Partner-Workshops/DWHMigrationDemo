target: bigquery
identifier_case: preserve
quote_char: "`"
max_identifier_length: 1024
qualification: three_part
reserved_words:
  - "ALL"
  - "AND"
  - "ANY"
  - "ARRAY"
  - "AS"
  - "ASC"
  - "ASSERT_ROWS_MODIFIED"
  - "AT"
  - "BETWEEN"
  - "BY"
  - "CASE"
  - "CAST"
  - "COLLATE"
  - "CONTAINS"
  - "CREATE"
  - "CROSS"
  - "CUBE"
  - "CURRENT"
  - "DEFAULT"
  - "DEFINE"
  - "DESC"
  - "DISTINCT"
  - "ELSE"
  - "END"
  - "ENUM"
  - "ESCAPE"
  - "EXCEPT"
  - "EXCLUDE"
  - "EXISTS"
  - "EXTRACT"
  - "FALSE"
  - "FETCH"
  - "FOLLOWING"
  - "FOR"
  - "FROM"
  - "FULL"
  - "GROUP"
  - "GROUPING"
  - "GROUPS"
  - "HASH"
  - "HAVING"
  - "IF"
  - "IGNORE"
  - "IN"
  - "INNER"
  - "INTERSECT"
  - "INTERVAL"
  - "INTO"
  - "IS"
  - "JOIN"
  - "LATERAL"
  - "LEFT"
  - "LIKE"
  - "LIMIT"
  - "LOOKUP"
  - "MERGE"
  - "NATURAL"
  - "NEW"
  - "NO"
  - "NOT"
  - "NULL"
  - "NULLS"
  - "OF"
  - "ON"
  - "OR"
  - "ORDER"
  - "OUTER"
  - "OVER"
  - "PARTITION"
  - "PRECEDING"
  - "PROTO"
  - "QUALIFY"
  - "RANGE"
  - "RECURSIVE"
  - "RESPECT"
  - "RIGHT"
  - "ROLLUP"
  - "ROWS"
  - "SELECT"
  - "SET"
  - "SOME"
  - "STRUCT"
  - "TABLESAMPLE"
  - "THEN"
  - "TO"
  - "TREAT"
  - "TRUE"
  - "UNBOUNDED"
  - "UNION"
  - "UNNEST"
  - "USING"
  - "WHEN"
  - "WHERE"
  - "WINDOW"
  - "WITH"
  - "WITHIN"
claims:
  - text: GoogleSQL quoted identifiers are enclosed by backticks, reserved keywords can't be used as identifiers unless enclosed by backticks, and table paths take the form project.dataset.table.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/lexical
    accessed: 2026-10-15
    confidence: high
  - text: BigQuery table names can contain up to 1,024 UTF-8 bytes and are case-sensitive by default.
    url: https://docs.cloud.google.com/bigquery/docs/tables
    accessed: 2026-10-15
    confidence: high
  - text: BigQuery dataset names can contain up to 1,024 characters made of letters, numbers and underscores, and are case-sensitive by default.
    url: https://docs.cloud.google.com/bigquery/docs/datasets
    accessed: 2026-10-15
    confidence: high
