id: sqlserver
name: Microsoft SQL Server
roles:
- source
versions_covered: SQL Server 2016-2025 (claims cite the current sql-server-ver17 documentation view)
summary: SQL Server is Microsoft's relational database engine, commonly used for departmental and enterprise data warehouses on a single scale-up instance. Data lives in 8 KB pages in rowstore heaps or clustered indexes, with columnstore indexes for analytic workloads. Logic is written in T-SQL procedures, functions and triggers, and ETL is commonly built in SSIS and scheduled with SQL Server Agent.
