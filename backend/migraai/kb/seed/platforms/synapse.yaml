id: synapse
name: Azure Synapse Analytics dedicated SQL pool
roles:
- source
- target
versions_covered: Azure Synapse Analytics dedicated SQL pool (formerly SQL DW), current service documentation
summary: A dedicated SQL pool is Synapse's provisioned MPP data warehouse. A control node splits each query across 60 distributions that compute nodes process in parallel, storage is decoupled from compute, and capacity is bought and scaled in data warehouse units (DWUs). It speaks a T-SQL dialect with notable gaps versus SQL Server, and data is usually loaded from Azure storage with COPY or PolyBase.
facets:
  architecture:
  - text: Dedicated SQL pool uses a scale-out architecture that spreads computational processing across multiple nodes.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: &id001 2026-10-15
    confidence: high
  - text: The control node receives queries, optimises them for parallel execution and hands the work to compute nodes.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: *id001
    confidence: high
  - text: The Data Movement Service (DMS) moves data between compute nodes during query execution.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: *id001
    confidence: high
  storage:
  - text: Each query is divided into 60 smaller queries, one per distribution, that run in parallel.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: *id001
    confidence: high
  - text: Tables get a clustered columnstore index by default when no index option is specified.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-index
    accessed: *id001
    confidence: high
  - text: Tables can be hash-distributed, round-robin distributed or replicated.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-distribute
    accessed: *id001
    confidence: high
  compute:
  - text: Compute power is measured and scaled in data warehouse units (DWUs).
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool compute resources can be paused and resumed.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: *id001
    confidence: high
  - text: Workload management uses workload classification, importance and isolation to manage resources.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-workload-management
    accessed: *id001
    confidence: high
  security:
  - text: Column-level security restricts access to table columns based on the user's execution context or group membership.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/column-level-security
    accessed: *id001
    confidence: high
  - text: Transparent data encryption (TDE) encrypts and decrypts data at rest.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool supports both SQL authentication and Microsoft Entra ID authentication.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-authentication
    accessed: *id001
    confidence: high
  scalability:
  - text: Compute is separate from storage, so compute can be scaled independently of the data held.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: *id001
    confidence: high
  - text: Maximum concurrency and memory per query depend on the service level and resource class.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/memory-concurrency-limits
    accessed: *id001
    confidence: medium
  sql_dialect:
  - text: Dedicated SQL pool implements ACID transactions with READ UNCOMMITTED as the default isolation level.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-transactions
    accessed: *id001
    confidence: high
  - text: CREATE TABLE AS SELECT (CTAS) creates and populates a new table from a SELECT in one parallel operation.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-ctas
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool supports WHILE loops for repeating a block of statements.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-loops
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool allows at most eight levels of stored procedure nesting.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-stored-procedures
    accessed: *id001
    confidence: high
  etl_tooling:
  - text: Synapse pipelines provide Azure Data Factory-style data integration inside the Synapse workspace.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/data-integration/concepts-data-factory-differences
    accessed: *id001
    confidence: medium
  - text: Microsoft recommends an extract, load and transform (ELT) approach for loading dedicated SQL pool.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/design-elt-data-loading
    accessed: *id001
    confidence: high
  data_movement:
  - text: The COPY statement loads data from external storage accounts into Azure Synapse Analytics.
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/copy-into-transact-sql?view=azure-sqldw-latest
    accessed: *id001
    confidence: high
  - text: PolyBase with T-SQL commands can load data from Azure Blob Storage into dedicated SQL pool tables.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-load-from-azure-blob-storage-with-polybase
    accessed: *id001
    confidence: high
unsupported_features:
- text: Foreign key constraints are not supported in dedicated SQL pool tables.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-overview
  accessed: *id001
  confidence: high
- text: Triggers are not supported in dedicated SQL pool tables.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-overview
  accessed: *id001
  confidence: high
- text: Sequence objects are not supported in dedicated SQL pool; surrogate keys are implemented with IDENTITY.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-overview
  accessed: *id001
  confidence: high
- text: Indexed views and computed columns are not supported in dedicated SQL pool tables.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-overview
  accessed: *id001
  confidence: high
