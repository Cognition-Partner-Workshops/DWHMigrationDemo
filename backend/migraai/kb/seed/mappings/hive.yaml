- native: from_unixtime(n)
  canonical: TIMESTAMP '1970-01-01 00:00:00' + n * INTERVAL '1' SECOND
  notes: Hive returns a formatted string, not a timestamp.
  claim:
    text: Hive from_unixtime(unixtime[, pattern]) converts epoch seconds to a formatted string.
