    accessed: '2026-10-15'
    confidence: high
- native: FLOAT
  canonical: float32
  notes: ''
  claim:
    text: Hive FLOAT is a 4-byte single-precision floating point number.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: DOUBLE / DOUBLE PRECISION
  canonical: float64
