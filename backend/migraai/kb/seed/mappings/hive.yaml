    confidence: high
- native: date_add(d, n)
  canonical: d + n * INTERVAL '1' DAY
  notes: ''
  claim:
    text: Hive date_add(startdate, days) adds a number of days.
    url: https://hive.apache.org/docs/latest/language/languagemanual-udf/
    accessed: '2026-10-15'
    confidence: high
- native: datediff(e, s)
  canonical: CAST(e AS DATE) - CAST(s AS DATE)
  notes: Result is a day count; ANSI date subtraction yields an interval on some engines.
  claim:
    text: Hive datediff(enddate, startdate) returns the number of days from startdate to enddate.
    url: https://hive.apache.org/docs/latest/language/languagemanual-udf/
    accessed: '2026-10-15'
    confidence: high
- native: add_months(d, n)
  canonical: d + n * INTERVAL '1' MONTH
  notes: Hive clamps to the last day of the month.
  claim:
    text: Hive add_months('2009-08-31', 1) returns '2009-09-30' (end-of-month clamping).
    url: https://hive.apache.org/docs/latest/language/languagemanual-udf/
    accessed: '2026-10-15'
    confidence: high
- native: trunc(d, 'MM')
  canonical: CAST(EXTRACT(YEAR FROM d) || '-' || EXTRACT(MONTH FROM d) || '-01' AS DATE)
  notes: Targets usually offer DATE_TRUNC.
  claim:
    text: Hive trunc(date, format) truncates a date to MONTH/MON/MM or YEAR/YYYY/YY.
    url: https://hive.apache.org/docs/latest/language/languagemanual-udf/
    accessed: '2026-10-15'
    confidence: high
- native: to_date(ts)
  canonical: CAST(ts AS DATE)
