    accessed: '2026-10-15'
    confidence: high
- native: unix_timestamp(s)
  canonical: EXTRACT(EPOCH FROM CAST(s AS TIMESTAMP))
  notes: EXTRACT(EPOCH ...) is a common extension, not core ANSI.
  claim:
    text: Hive unix_timestamp(date) converts a date string to epoch seconds and returns null when conversion fails.
