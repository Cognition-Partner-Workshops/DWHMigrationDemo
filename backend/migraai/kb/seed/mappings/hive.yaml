    text: STRING is Hive's unbounded string type.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: VARCHAR(n)
  canonical: varchar
  notes: Values longer than n are silently truncated.
  claim:
    text: Hive VARCHAR takes a length of 1 to 65535 and silently truncates longer values.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: CHAR(n)
  canonical: char
  notes: ''
  claim:
    text: Hive CHAR is fixed-length, space-padded and has a maximum length of 255.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: BOOLEAN
  canonical: boolean
  notes: ''
  claim:
    text: BOOLEAN is a Hive primitive type.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: BINARY
  canonical: varbinary
  notes: Unbounded byte array.
  claim:
    text: BINARY is available as a Hive type starting with Hive 0.8.0.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: TIMESTAMP
  canonical: timestamp
  notes: Timezone-less; up to nanosecond precision.
  claim:
    text: Hive TIMESTAMP values are time-zone-less offsets from the UNIX epoch with optional nanosecond precision.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: DATE
  canonical: date
  notes: ''
  claim:
    text: Hive DATE holds year/month/day with no time of day, ranging 0000-01-01 to 9999-12-31.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: INTERVAL
  canonical: interval
  notes: Year-to-month and day-to-second intervals.
  claim:
    text: Hive supports year-to-month and day-to-second INTERVAL literals from Hive 1.2.0.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    applies_to: Hive 1.2+
    confidence: high
- native: ARRAY<T>
  canonical: array
  notes: ''
  claim:
    text: Hive ARRAY<data_type> is a complex type.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: MAP<K,V>
  canonical: map
  notes: Keys must be primitive types.
  claim:
    text: Hive MAP keys must be a primitive type.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: STRUCT<...>
  canonical: struct
  notes: ''
  claim:
    text: Hive STRUCT is a complex type of named fields with optional comments.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- native: UNIONTYPE<...>
  canonical: other
  notes: No equivalent on most targets; flatten or convert to STRUCT/JSON.
  claim:
    text: Hive UNIONTYPE support is incomplete and the type is effectively pass-through only.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
