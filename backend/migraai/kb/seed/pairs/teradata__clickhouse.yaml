source: teradata
target: clickhouse
architecture_overview:
- text: Teradata PE and AMP vprocs share neither memory nor disk, giving a shared-nothing design.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse is a column-oriented database that stores each column separately.
  url: https://clickhouse.com/docs/concepts/core-concepts/academic-overview
  accessed: '2026-10-15'
  confidence: high
- text: MergeTree is ClickHouse's main table engine family for high ingest rates and large data volumes.
  url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Teradata row partitioning (PPI) enables row partition elimination for large query gains.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Primary-Index-Primary-AMP-Index-and-NoPI-Objects/Advantages-and-Disadvantages-of-Partitioned-Primary-Indexes
    accessed: '2026-10-15'
    confidence: high
  - text: Each INSERT into a ClickHouse MergeTree table creates an immutable data part.
    url: https://clickhouse.com/docs/concepts/core-concepts/parts
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Choosing primary indexes so joined rows hash to the same AMP avoids redistributing rows across the BYNET.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse parallelizes a query across CPU cores by splitting data into processing lanes.
    url: https://clickhouse.com/docs/concepts/core-concepts/query-parallelism
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Teradata row level security controls access per row and per SQL operation by comparing user and row security labels.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Security-Administration/Implementing-Row-Level-Security/Row-Level-Security
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse access control supports users, roles, settings profiles, quotas and row policies.
    url: https://clickhouse.com/docs/concepts/features/security/access-rights
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Teradata balances work by spreading rows evenly across AMPs, each solely responsible for its own data.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse replication is provided by Replicated* variants of MergeTree engines.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/replication
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Teradata resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into ClickHouse, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for ClickHouse instead of copying Teradata structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
