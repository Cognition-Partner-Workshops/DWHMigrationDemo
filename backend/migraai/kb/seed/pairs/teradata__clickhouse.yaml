risks:
  sql:
    level: high
    notes: Teradata extensions and procedural code need rewriting for ClickHouse.
  data:
    level: medium
    notes: Type differences (precision, time zones, large objects, semi-structured data) need per-column checks.
  security:
    level: medium
    notes: Grants and row/column rules must be re-implemented with the target security model.
  governance:
    level: medium
    notes: Lineage, ownership and audit settings must be re-established on the target.
  platform:
    level: high
    notes: Unenforced or missing constraints and different transaction semantics can change behaviour.
  operational:
    level: medium
    notes: Load jobs, scheduling and monitoring move to target-native tooling.
optimization_hints:
- text: ClickHouse recommends materialized views to shift computation from query time to insert time.
  url: https://clickhouse.com/docs/concepts/best-practices/use-materialized-views
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse projections store an alternative ordering or pre-aggregation of a table's data inside the table's parts.
  url: https://clickhouse.com/docs/concepts/features/projections/projections
  accessed: '2026-10-15'
  confidence: high
