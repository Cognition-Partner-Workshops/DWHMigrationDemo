source: hive
target: synapse
architecture_overview:
- text: HiveServer2 runs a Thrift-based Hive service (TCP or HTTP) with a Jetty web UI in one process.
  url: https://hive.apache.org/docs/latest/user/hiveserver2-overview/
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool sends T-SQL to a Control node that distributes work to Compute nodes.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool tables are stored across 60 distributions.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-distribute
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Hive owns managed-table data (dropped with the table) but not external-table data.
    url: https://hive.apache.org/docs/latest/language/managed-vs--external-tables/
    accessed: '2026-10-15'
    confidence: high
  - text: Dedicated SQL pool Compute nodes store user data in Azure Storage.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Hive executes queries using Apache Tez or MapReduce.
    url: https://hive.apache.org/docs/latest/introduction-to-apache-hive/
    accessed: '2026-10-15'
    confidence: high
  - text: Dedicated SQL pools can be paused to save cost or scaled for performance.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Hive storage based authorization relies on HDFS permissions and works at database, table and partition level.
    url: https://hive.apache.org/docs/latest/language/languagemanual-authorization/
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse connection security uses firewall rules and connection encryption.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Hive global ORDER BY needs a single reducer for the final sort.
    url: https://hive.apache.org/docs/latest/language/languagemanual-sortby/
    accessed: '2026-10-15'
    confidence: high
  - text: Dedicated SQL pool allows at most 128 concurrent queries.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/memory-concurrency-limits
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Extract Hive DDL, partitions and HPL/SQL scripts from the metastore and edge nodes, compact ACID tables, then copy ORC/Parquet files from HDFS to cloud object storage and load or register them in Azure Synapse dedicated SQL pool. Rewrite HiveQL-specific clauses (SORT BY, DISTRIBUTE BY, LATERAL VIEW, multi-insert), replace Oozie/scheduled queries with Azure Synapse dedicated SQL pool orchestration, map Ranger/SQL-standard grants to Azure Synapse dedicated SQL pool security, and validate partition-by-partition.
