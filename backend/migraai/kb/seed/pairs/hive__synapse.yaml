sql_dialect_differences:
- text: Hive SORT BY orders rows only within each reducer, so output may be only partially ordered.
  url: https://hive.apache.org/docs/latest/language/languagemanual-sortby/
  accessed: '2026-10-15'
  confidence: high
- text: Hive LATERAL VIEW applies a UDTF such as explode() to each input row.
  url: https://hive.apache.org/docs/latest/language/languagemanual-lateralview/
  accessed: '2026-10-15'
  confidence: high
- text: HiveQL SELECT has non-standard CLUSTER BY, DISTRIBUTE BY and SORT BY clauses.
  url: https://hive.apache.org/docs/latest/language/languagemanual-select/
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool PRIMARY KEY requires NONCLUSTERED and NOT ENFORCED.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-overview
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool does not support geography, geometry, xml and several other SQL Server types.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-data-types
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool guidance replaces cursors with WHILE loops.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-loops
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool stored procedures are not pre-compiled.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-stored-procedures
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool tables allow at most 1,024 columns.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-service-capacity-limits
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: Hive LOAD DATA moves files into a table or partition without transformation.
  url: https://hive.apache.org/docs/latest/language/languagemanual-dml/
  accessed: '2026-10-15'
  confidence: high
- text: Hive EXPORT writes table or partition data plus metadata to an output location.
  url: https://hive.apache.org/docs/latest/language/languagemanual-importexport/
  accessed: '2026-10-15'
  confidence: high
- text: Synapse recommends ELT so loading uses built-in distributed query processing.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/design-elt-data-loading
  accessed: '2026-10-15'
  confidence: high
- text: Synapse external tables point to data in Hadoop, Azure Blob Storage or ADLS.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql/develop-tables-external-tables
  accessed: '2026-10-15'
  confidence: high
- text: Data Factory or Synapse pipelines copy data from Hive using the Copy activity.
  url: https://learn.microsoft.com/en-us/azure/data-factory/connector-hive
  accessed: '2026-10-15'
  confidence: high
