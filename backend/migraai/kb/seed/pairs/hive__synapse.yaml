- text: Azure Data Factory is a managed cloud service for hybrid ETL/ELT and data integration.
  url: https://learn.microsoft.com/en-us/azure/data-factory/introduction
  accessed: '2026-10-15'
  confidence: high
- text: Dedicated SQL pool stored procedures encapsulate SQL close to the data.
