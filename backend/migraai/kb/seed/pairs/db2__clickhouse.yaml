- for: db2_distribute_by
  claim:
    text: ClickHouse primary keys build a sparse index over granules of rows rather than an index entry per row.
    url: https://clickhouse.com/docs/concepts/core-concepts/primary-indexes
    accessed: '2026-10-15'
    confidence: high
- for: db2_sql_pl
  claim:
    text: ClickHouse CREATE FUNCTION defines a SQL user-defined function from a lambda expression.
    url: https://clickhouse.com/docs/reference/statements/create/function
    accessed: '2026-10-15'
    confidence: high
- for: db2_rcac
  claim:
    text: A ClickHouse row policy is a filter that defines which rows a user or role can read.
    url: https://clickhouse.com/docs/reference/statements/create/row-policy
    accessed: '2026-10-15'
    confidence: high
risks:
  sql:
    level: high
    notes: Db2 Warehouse extensions and procedural code need rewriting for ClickHouse.
  data:
    level: medium
    notes: Type differences (precision, time zones, large objects, semi-structured data) need per-column checks.
  security:
    level: medium
    notes: Grants and row/column rules must be re-implemented with the target security model.
  governance:
    level: medium
    notes: Lineage, ownership and audit settings must be re-established on the target.
  platform:
    level: high
    notes: Unenforced or missing constraints and different transaction semantics can change behaviour.
  operational:
    level: medium
    notes: Load jobs, scheduling and monitoring move to target-native tooling.
optimization_hints:
- text: ClickHouse recommends materialized views to shift computation from query time to insert time.
  url: https://clickhouse.com/docs/concepts/best-practices/use-materialized-views
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse projections store an alternative ordering or pre-aggregation of a table's data inside the table's parts.
  url: https://clickhouse.com/docs/concepts/features/projections/projections
  accessed: '2026-10-15'
  confidence: high
