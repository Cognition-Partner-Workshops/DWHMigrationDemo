source: db2
target: clickhouse
architecture_overview:
- text: A Db2 Warehouse MPP cluster scales out by adding data nodes with minimal interruption.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse is a column-oriented database that stores each column separately.
  url: https://clickhouse.com/docs/concepts/core-concepts/academic-overview
  accessed: '2026-10-15'
  confidence: high
- text: MergeTree is ClickHouse's main table engine family for high ingest rates and large data volumes.
  url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Db2 CREATE TABLE has an ORGANIZE BY clause to choose column- or row-organized storage.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table
    accessed: '2026-10-15'
    confidence: high
  - text: Each INSERT into a ClickHouse MergeTree table creates an immutable data part.
    url: https://clickhouse.com/docs/concepts/core-concepts/parts
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Db2 workload management uses DDL objects such as service classes, workloads, thresholds and work action sets.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=identification-workload-management-ddl-statements
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse parallelizes a query across CPU cores by splitting data into processing lanes.
    url: https://clickhouse.com/docs/concepts/core-concepts/query-parallelism
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Db2 Warehouse row and column access control (RCAC) filters rows and masks columns per user as fine-grained access control.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse access control supports users, roles, settings profiles, quotas and row policies.
    url: https://clickhouse.com/docs/concepts/features/security/access-rights
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Db2 Warehouse MPP cluster needs at least three nodes (one head, two data) and an SMP deployment cannot be turned into MPP by adding nodes.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse replication is provided by Replicated* variants of MergeTree engines.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/replication
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Db2 Warehouse resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into ClickHouse, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for ClickHouse instead of copying Db2 Warehouse structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
object_mapping:
- source_object: Table (DISTRIBUTE BY / ORGANIZE BY)
  target_object: MergeTree table
  notes: ''
  claim:
    text: MergeTree is ClickHouse's main table engine family for high ingest rates and large data volumes.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: '2026-10-15'
    confidence: high
- source_object: SQL procedure (SQL PL)
  target_object: SQL user-defined function
  notes: Procedural control flow has to move to application or ETL code.
  claim:
    text: ClickHouse CREATE FUNCTION defines a SQL user-defined function from a lambda expression.
    url: https://clickhouse.com/docs/reference/statements/create/function
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC row permission
  target_object: Row policy
  notes: ''
  claim:
    text: A ClickHouse row policy is a filter that defines which rows a user or role can read.
    url: https://clickhouse.com/docs/reference/statements/create/row-policy
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC column mask
  target_object: Masking policy
  notes: ''
  claim:
    text: ClickHouse provides CREATE MASKING POLICY for column masking.
    url: https://clickhouse.com/docs/reference/statements/create/masking-policy
    accessed: '2026-10-15'
    confidence: medium
- source_object: Materialized query table
  target_object: Incremental materialized view
  notes: ''
  claim:
    text: ClickHouse incremental materialized views run their query on each inserted block and write results to a target table.
    url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
    accessed: '2026-10-15'
    confidence: high
- source_object: External table
  target_object: S3 table engine
  notes: ''
  claim:
    text: The ClickHouse S3 table engine reads and writes data in Amazon S3 or S3-compatible storage.
    url: https://clickhouse.com/docs/reference/engines/table-engines/integrations/s3
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Db2 Warehouse accepts the Oracle (+) outer join operator in WHERE predicates.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 Warehouse supports Oracle-style hierarchical (recursive) queries.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 DECODE compares an expression with search values and returns the matching result.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=functions-decode
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse SELECT supports standard join types including INNER, LEFT, RIGHT, FULL and CROSS.
  url: https://clickhouse.com/docs/reference/statements/select/join
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse supports a QUALIFY clause for filtering on window function results.
  url: https://clickhouse.com/docs/reference/statements/select/qualify
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse lightweight DELETE marks rows as deleted so they are hidden immediately and removed during later merges.
  url: https://clickhouse.com/docs/concepts/features/operations/delete/lightweight-delete
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: A Db2 Warehouse external table maps a delimited or fixed-length file outside the database and can be used to query or unload data.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table-external
  accessed: '2026-10-15'
  confidence: high
- text: The ClickHouse S3 table engine reads and writes data in Amazon S3 or S3-compatible storage.
  url: https://clickhouse.com/docs/reference/engines/table-engines/integrations/s3
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse can ingest data exported to cloud object storage such as S3, GCS or Azure Blob storage.
  url: https://clickhouse.com/docs/get-started/migrate/other-methods/object-storage-to-clickhouse
  accessed: '2026-10-15'
  confidence: high
etl_migration:
- text: The Db2 Warehouse dbload command loads data files in local mode or in remote mode over the network.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=command-loading-data-files-dbload
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse integrates with third-party ETL/ELT tools for loading data from other systems.
  url: https://clickhouse.com/docs/get-started/migrate/other-methods/etl-tool-to-clickhouse
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse documents migration paths from other databases, ETL tools and object storage.
  url: https://clickhouse.com/docs/get-started/migrate/overview
  accessed: '2026-10-15'
  confidence: high
security_migration:
- text: Db2 GRANT ROLE grants roles to users, groups or other roles, optionally WITH ADMIN OPTION.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-grant-role
  accessed: '2026-10-15'
  confidence: high
- text: Only users with SECADM authority can manage Db2 row and column access controls.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse access control supports users, roles, settings profiles, quotas and row policies.
  url: https://clickhouse.com/docs/concepts/features/security/access-rights
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse GRANT gives privileges to users or roles, with optional WITH GRANT OPTION.
  url: https://clickhouse.com/docs/reference/statements/grant
  accessed: '2026-10-15'
  confidence: high
