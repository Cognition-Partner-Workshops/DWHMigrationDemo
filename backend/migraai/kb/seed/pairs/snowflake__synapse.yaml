risks:
  sql:
    level: high
    notes: Dialect rewrites (Snowflake specifics to Azure Synapse dedicated SQL pool)
  data:
    level: medium
    notes: Type and precision mapping, semi-structured data and timestamp semantics
  security:
    level: medium
    notes: Re-creating roles, grants and fine-grained policies in the Azure Synapse dedicated SQL pool model
  governance:
    level: medium
    notes: Lineage, tags and catalog ownership must be rebuilt
  platform:
    level: high
    notes: Feature gaps between Snowflake and Azure Synapse dedicated SQL pool need redesign
  operational:
    level: medium
    notes: Re-platforming orchestration, monitoring and cost controls
