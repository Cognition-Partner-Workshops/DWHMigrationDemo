source: netezza
target: snowflake
architecture_overview:
- text: Netezza spreads processing across SPUs that each own memory and data slices in a shared-nothing design.
  url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake separates centralized storage from virtual warehouse compute in a hybrid shared-disk and shared-nothing design.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake stores table data in automatically managed micro-partitions.
  url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Netezza zone maps let the storage manager skip table extents that cannot contain rows matching a restricted scan.
    url: https://www.ibm.com/docs/en/netezza?topic=statistics-zone-maps
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake stores table data in automatically managed micro-partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Tables that are commonly joined should be distributed on the join column so Netezza can run a collocated join without moving data between SPUs.
    url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake separates centralized storage from virtual warehouse compute in a hybrid shared-disk and shared-nothing design.
    url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: In Netezza, privileges granted to a group are inherited by all its members and are additive.
    url: https://www.ibm.com/docs/en/netezza?topic=control-security-model
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake access control combines discretionary and role-based models, granting privileges to roles.
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Netezza tables are distributed with DISTRIBUTE ON (columns) for hash distribution or DISTRIBUTE ON RANDOM for random distribution.
    url: https://www.ibm.com/docs/en/netezza?topic=databases-distribution-keys
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake multi-cluster warehouses add clusters automatically to handle query concurrency.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Netezza resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Snowflake, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Snowflake instead of copying Netezza structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
