risks:
  sql:
    level: high
    notes: PL/SQL to GoogleSQL is substantial; translation tooling helps.
  data:
    level: medium
    notes: Partition/cluster modeling and DATE semantics need care.
  security:
    level: medium
    notes: VPD/grants map to IAM + row access policies.
  governance:
    level: medium
    notes: Dataplex/org-policy model replaces schema governance.
  platform:
    level: high
    notes: Serverless model replaces instance management.
  operational:
    level: medium
    notes: New observability surface (slots, monitoring).
