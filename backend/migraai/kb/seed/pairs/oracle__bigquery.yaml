source: oracle
target: bigquery
architecture_overview:
- text: An Oracle database server consists of a database plus at least one database instance.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/introduction-to-oracle-database.html
  accessed: &id001 2026-10-15
  confidence: high
- text: CREATE TABLE creates a heap-organized table by default, which keeps rows in no particular order.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/tables-and-table-clusters.html
  accessed: *id001
  confidence: high
- text: Oracle RAC combines smaller commodity servers into a cluster to build scalable environments.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/racad/introduction-to-oracle-rac.html
  accessed: *id001
  confidence: high
- text: BigQuery is a fully managed, AI-ready data platform with a serverless architecture.
  url: https://docs.cloud.google.com/bigquery/docs/introduction
  accessed: *id001
  confidence: high
- text: BigQuery separates storage and compute, scaling each independently, and executes queries completely in memory across parallel workers.
  url: https://docs.cloud.google.com/bigquery/docs/storage_overview
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: CREATE TABLE creates a heap-organized table by default, which keeps rows in no particular order.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/cncpt/tables-and-table-clusters.html
    accessed: *id001
    confidence: high
  - text: Partitioning splits tables, indexes and index-organized tables into smaller pieces that can be managed and accessed individually.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/vldbg/partition-concepts.html
    accessed: *id001
    confidence: high
  - text: A partitioned table in BigQuery is divided into segments called partitions, enabling partition pruning on the partitioning column.
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
    accessed: *id001
    confidence: high
  - text: A clustered table in BigQuery sorts storage blocks by user-defined clustered columns to reduce scanned bytes.
    url: https://docs.cloud.google.com/bigquery/docs/clustered-tables
    accessed: *id001
    confidence: high
  compute:
  - text: Parallel execution applies multiple CPU and I/O resources to a single SQL statement.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/vldbg/parallel-exec-intro.html
    accessed: *id001
    confidence: high
  - text: Database Resource Manager controls how resources are allocated within a database.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/admin/managing-resources-with-oracle-database-resource-manager.html
    accessed: *id001
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute SQL queries.
    url: https://docs.cloud.google.com/bigquery/docs/slots
    accessed: *id001
    confidence: high
  security:
  - text: Virtual Private Database (VPD) filters which rows users can access through security policies.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/using-oracle-vpd-to-control-data-access.html
    accessed: *id001
    confidence: high
  - text: Transparent Data Encryption (TDE) encrypts sensitive data stored in tables and tablespaces.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/asoag/introduction-to-transparent-data-encryption.html
    accessed: *id001
    confidence: high
  - text: BigQuery access control uses Identity and Access Management (IAM) predefined roles and permissions.
    url: https://docs.cloud.google.com/bigquery/docs/access-control
    accessed: *id001
    confidence: high
  - text: BigQuery row-level security uses row access policies to filter rows visible to a user.
    url: https://docs.cloud.google.com/bigquery/docs/row-level-security-intro
    accessed: *id001
    confidence: high
  scalability:
  - text: Oracle RAC combines smaller commodity servers into a cluster to build scalable environments.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/racad/introduction-to-oracle-rac.html
    accessed: *id001
    confidence: high
  - text: Parallel execution applies multiple CPU and I/O resources to a single SQL statement.
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/vldbg/parallel-exec-intro.html
    accessed: *id001
    confidence: high
  - text: BigQuery separates storage and compute, scaling each independently, and executes queries completely in memory across parallel workers.
    url: https://docs.cloud.google.com/bigquery/docs/storage_overview
    accessed: *id001
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute SQL queries.
    url: https://docs.cloud.google.com/bigquery/docs/slots
    accessed: *id001
    confidence: high
recommended_strategy: 'Google documents an Oracle→BigQuery path: migrate schema with the migration tooling/schema overview, translate SQL via the Oracle SQL translation guide and batch translator, move data with the Data Transfer Service or export-and-load, and remodel partitioning/clustering for BigQuery''s layout. Map VPD to row access policies and Resource Manager to slot reservations.'
object_mapping:
- source_object: Heap-organized table
  target_object: BigQuery table
  notes: Tables stored columnar; layout managed.
  claim:
    text: BigQuery is a fully managed, AI-ready data platform with a serverless architecture.
    url: https://docs.cloud.google.com/bigquery/docs/introduction
    accessed: *id001
    confidence: high
- source_object: Partitioned table
  target_object: Partitioned table
  notes: Native partitioning exists.
  claim:
    text: A partitioned table in BigQuery is divided into segments called partitions, enabling partition pruning on the partitioning column.
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
    accessed: *id001
    confidence: high
- source_object: Materialized view
  target_object: Materialized view
  notes: BQ supports MVs.
  claim:
    text: BigQuery materialized views are precomputed tables that optimize query performance and reduce execution costs.
    url: https://docs.cloud.google.com/bigquery/docs/materialized-views-intro
    accessed: *id001
    confidence: high
- source_object: Package (PL/SQL)
  target_object: GoogleSQL procedures
  notes: No packages; split into procedures/scripts.
  claim:
    text: A BigQuery stored procedure is a collection of statements that supports procedural language statements.
    url: https://docs.cloud.google.com/bigquery/docs/procedures
    accessed: *id001
    confidence: high
- source_object: Sequence
  target_object: Identity column or generated key
  notes: Use identity columns.
  claim:
    text: BigQuery column definitions support GENERATED ALWAYS or BY DEFAULT AS IDENTITY.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language
    accessed: *id001
    confidence: high
- source_object: MERGE statement
  target_object: MERGE
  notes: BigQuery supports MERGE.
  claim:
    text: BigQuery's MERGE statement combines INSERT, UPDATE and DELETE operations into a single atomic statement.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/dml-syntax
    accessed: *id001
    confidence: high
sql_dialect_differences:
- text: Oracle treats a zero-length character value as NULL, unlike most target platforms.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Nulls.html
  accessed: *id001
  confidence: high
- text: Oracle hierarchical queries use START WITH for root rows and CONNECT BY for the parent-child relationship.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Hierarchical-Queries.html
  accessed: *id001
  confidence: high
- text: The Oracle DATE data type holds both date and time information.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Data-Types.html
  accessed: *id001
  confidence: high
- text: NVL returns the second argument when the first is null — Oracle's equivalent of COALESCE with two args.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/NVL.html
  accessed: *id001
  confidence: high
- text: DECODE compares an expression to search values one by one — a non-ANSI conditional.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/DECODE.html
  accessed: *id001
  confidence: high
- text: LISTAGG orders data within each group and concatenates the measure values.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/LISTAGG.html
  accessed: *id001
  confidence: high
- text: Google publishes dedicated guidance for migrating Oracle data warehouses and data marts (including Exadata) to BigQuery.
  url: https://docs.cloud.google.com/bigquery/docs/migration/oracle-migration
  accessed: *id001
  confidence: high
- text: The GoogleSQL procedural language executes multiple statements in one query as a multi-statement query.
  url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language
  accessed: *id001
  confidence: high
- text: BigQuery does not enforce primary and foreign key constraints; they exist for query optimization.
  url: https://docs.cloud.google.com/bigquery/docs/primary-foreign-keys
  accessed: *id001
  confidence: high
data_movement:
- text: Oracle Data Pump moves data and metadata between databases at high speed, using the expdp and impdp clients.
