source: db2
target: redshift
architecture_overview:
- text: A Db2 Warehouse MPP cluster scales out by adding data nodes with minimal interruption.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
  accessed: '2026-10-15'
  confidence: high
- text: A provisioned Amazon Redshift cluster has a leader node that parses queries and coordinates compute nodes.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
  accessed: '2026-10-15'
  confidence: high
- text: Each Redshift compute node is divided into slices that each process a share of the node's data.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Db2 CREATE TABLE has an ORGANIZE BY clause to choose column- or row-organized storage.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table
    accessed: '2026-10-15'
    confidence: high
  - text: Redshift stores table data in columnar format to reduce I/O for analytic queries.
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_columnar_storage_disk_mem_mgmnt.html
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Db2 workload management uses DDL objects such as service classes, workloads, thresholds and work action sets.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=identification-workload-management-ddl-statements
    accessed: '2026-10-15'
    confidence: high
  - text: Redshift workload management (WLM) routes queries to queues to manage concurrency and memory.
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_workload_mngmt_classification.html
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Db2 Warehouse row and column access control (RCAC) filters rows and masks columns per user as fine-grained access control.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
    accessed: '2026-10-15'
    confidence: high
  - text: Redshift role-based access control (RBAC) grants permissions to roles that are then granted to users.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_Roles.html
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Db2 Warehouse MPP cluster needs at least three nodes (one head, two data) and an SMP deployment cannot be turned into MPP by adding nodes.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
    accessed: '2026-10-15'
    confidence: high
  - text: Redshift concurrency scaling adds transient cluster capacity to handle bursts of concurrent queries.
    url: https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Db2 Warehouse resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Redshift, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Redshift instead of copying Db2 Warehouse structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
object_mapping:
- source_object: Table (DISTRIBUTE BY / ORGANIZE BY)
  target_object: Table with DISTSTYLE / sort key
  notes: ''
  claim:
    text: 'Redshift tables use one of four distribution styles: AUTO, EVEN, KEY or ALL.'
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_choosing_dist_sort.html
    accessed: '2026-10-15'
    confidence: high
- source_object: SQL procedure (SQL PL)
  target_object: Stored procedure (PL/pgSQL)
  notes: ''
  claim:
    text: Redshift stored procedures are written in PL/pgSQL.
    url: https://docs.aws.amazon.com/redshift/latest/dg/stored-procedure-overview.html
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC row permission
  target_object: RLS policy
  notes: ''
  claim:
    text: Redshift row-level security (RLS) policies restrict which rows a user or role can see.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_rls.html
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC column mask
  target_object: Dynamic data masking policy
  notes: ''
  claim:
    text: Redshift dynamic data masking applies masking policies to columns at query time.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_ddm.html
    accessed: '2026-10-15'
    confidence: high
- source_object: Materialized query table
  target_object: Materialized view
  notes: ''
  claim:
    text: A Redshift materialized view stores a precomputed result set that can be refreshed.
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-overview.html
    accessed: '2026-10-15'
    confidence: high
- source_object: Informational constraint
  target_object: Informational constraint
  notes: ''
  claim:
    text: Redshift unique, primary key and foreign key constraints are informational only and not enforced.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_Defining_constraints.html
    accessed: '2026-10-15'
    confidence: high
- source_object: External table
  target_object: External table (Spectrum)
  notes: ''
  claim:
    text: Redshift CREATE EXTERNAL TABLE defines a table in an external schema over data in Amazon S3.
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_EXTERNAL_TABLE.html
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Db2 Warehouse accepts the Oracle (+) outer join operator in WHERE predicates.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 Warehouse supports Oracle-style hierarchical (recursive) queries.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 DECODE compares an expression with search values and returns the matching result.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=functions-decode
  accessed: '2026-10-15'
  confidence: high
- text: Redshift supports the QUALIFY clause to filter on window function results.
  url: https://docs.aws.amazon.com/redshift/latest/dg/r_QUALIFY_clause.html
  accessed: '2026-10-15'
  confidence: high
- text: Redshift MERGE conditionally inserts, updates or deletes target rows from a source table.
  url: https://docs.aws.amazon.com/redshift/latest/dg/r_MERGE.html
  accessed: '2026-10-15'
  confidence: high
- text: Redshift does not support PostgreSQL types such as arrays, XML and UUID.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-datatypes.html
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: A Db2 Warehouse external table maps a delimited or fixed-length file outside the database and can be used to query or unload data.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table-external
  accessed: '2026-10-15'
  confidence: high
- text: Redshift COPY loads data in parallel from files in Amazon S3 and other sources such as DynamoDB and EMR.
  url: https://docs.aws.amazon.com/redshift/latest/dg/r_COPY.html
  accessed: '2026-10-15'
  confidence: high
- text: AWS SCT data extraction agents extract data from a source warehouse and upload it to Amazon S3 for loading into Redshift.
  url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/agents.html
  accessed: '2026-10-15'
  confidence: high
- text: AWS DMS can use IBM Db2 for LUW as a source for data migration.
  url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.DB2.html
  accessed: '2026-10-15'
  confidence: high
etl_migration:
- text: The Db2 Warehouse dbload command loads data files in local mode or in remote mode over the network.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=command-loading-data-files-dbload
  accessed: '2026-10-15'
  confidence: high
- text: AWS Schema Conversion Tool (AWS SCT) converts source database schemas and code to a target such as Amazon Redshift.
  url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Welcome.html
  accessed: '2026-10-15'
  confidence: high
- text: Redshift stored procedures are written in PL/pgSQL.
  url: https://docs.aws.amazon.com/redshift/latest/dg/stored-procedure-overview.html
  accessed: '2026-10-15'
  confidence: high
- text: AWS SCT supports IBM Db2 for LUW as a source database.
  url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Source.DB2LUW.html
  accessed: '2026-10-15'
  confidence: high
security_migration:
- text: Db2 GRANT ROLE grants roles to users, groups or other roles, optionally WITH ADMIN OPTION.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-grant-role
  accessed: '2026-10-15'
  confidence: high
- text: Only users with SECADM authority can manage Db2 row and column access controls.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
  accessed: '2026-10-15'
  confidence: high
- text: Redshift role-based access control (RBAC) grants permissions to roles that are then granted to users.
  url: https://docs.aws.amazon.com/redshift/latest/dg/t_Roles.html
  accessed: '2026-10-15'
  confidence: high
