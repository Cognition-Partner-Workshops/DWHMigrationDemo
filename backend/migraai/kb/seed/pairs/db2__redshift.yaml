risks:
  sql:
    level: medium
    notes: Db2 Warehouse extensions and procedural code need rewriting for Redshift.
  data:
    level: medium
    notes: Type differences (precision, time zones, large objects, semi-structured data) need per-column checks.
  security:
    level: medium
    notes: Grants and row/column rules must be re-implemented with the target security model.
  governance:
    level: low
    notes: Lineage, ownership and audit settings must be re-established on the target.
  platform:
    level: medium
    notes: Unenforced or missing constraints and different transaction semantics can change behaviour.
  operational:
    level: medium
    notes: Load jobs, scheduling and monitoring move to target-native tooling.
optimization_hints:
- text: Redshift sort keys order rows on disk so the planner can skip blocks outside a range predicate.
  url: https://docs.aws.amazon.com/redshift/latest/dg/t_Sorting_data.html
  accessed: '2026-10-15'
  confidence: high
- text: Redshift applies column-level compression encodings to reduce storage and I/O.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_Compression_encodings.html
  accessed: '2026-10-15'
  confidence: high
