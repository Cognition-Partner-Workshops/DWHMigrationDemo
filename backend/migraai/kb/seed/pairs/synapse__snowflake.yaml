risks:
  sql:
    level: high
    notes: T-SQL dialect differences require SnowConvert-assisted translation.
  data:
    level: medium
    notes: Distribution/columnstore decisions map to clustering choices that affect pruning.
  security:
    level: medium
    notes: SQL pool security maps to account-level RBAC and policies.
  governance:
    level: low
    notes: Snowflake governance model differs; plan role hierarchy.
  platform:
    level: medium
    notes: DWU model replaced by credit-based warehouses.
  operational:
    level: low
    notes: Pause/resume concepts map to warehouse auto-suspend.
