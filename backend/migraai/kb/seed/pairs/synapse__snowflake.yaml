source: synapse
target: snowflake
architecture_overview:
- text: Dedicated SQL pool uses a scale-out architecture that spreads computational processing across multiple nodes.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: &id001 2026-10-15
  confidence: high
- text: The control node receives queries, optimises them for parallel execution and hands the work to compute nodes.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: *id001
  confidence: high
- text: Snowflake's architecture is a hybrid of traditional shared-disk and shared-nothing database architectures.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: *id001
  confidence: high
- text: Snowflake is a self-managed cloud service with no hardware or software to install, configure or manage.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: Tables get a clustered columnstore index by default when no index option is specified in dedicated SQL pool.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-index
    accessed: *id001
    confidence: high
  - text: Snowflake stores table data in micro-partitions rather than user-managed static partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: *id001
    confidence: high
  compute:
  - text: Compute power in dedicated SQL pool is measured and scaled in data warehouse units (DWUs).
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: *id001
    confidence: high
  - text: Workload management in dedicated SQL pool uses workload classification, importance and isolation to manage resources.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-workload-management
    accessed: *id001
    confidence: high
  - text: Virtual warehouses provide the compute required for queries and all DML operations including data loading.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: *id001
    confidence: high
  - text: A warehouse can be resized at any time, even while running, to add or remove compute resources.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: *id001
    confidence: high
  security:
  - text: Column-level security restricts access to table columns based on the user's execution context or group membership.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/column-level-security
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool supports both SQL authentication and Microsoft Entra ID authentication.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-authentication
    accessed: *id001
    confidence: high
  - text: Snowflake access control assigns privileges to roles, which are assigned to users (RBAC).
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: *id001
    confidence: high
  - text: Snowflake Dynamic Data Masking uses masking policies to obfuscate column data at query time.
    url: https://docs.snowflake.com/en/user-guide/security-column-ddm-intro
    accessed: *id001
    confidence: high
  scalability:
  - text: In dedicated SQL pool compute is separate from storage, so compute can be scaled independently of the data held.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool compute resources can be paused and resumed.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: *id001
    confidence: high
  - text: Virtual warehouses provide the compute required for queries and all DML operations including data loading.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: *id001
    confidence: high
  - text: Multi-cluster warehouses let Snowflake scale compute resources for concurrency needs.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: *id001
    confidence: high
recommended_strategy: Export dedicated-pool tables to cloud storage (CETAS/PolyBase), recreate them as Snowflake tables (micro-partitioned, optionally clustered), translate T-SQL with SnowConvert, and load via COPY INTO. Replace DWU/resource-class tuning with right-sized virtual warehouses and multi-cluster scaling; map security to RBAC, masking policies and row access policies.
object_mapping:
- source_object: Distributed table
  target_object: Standard table + optional clustering
  notes: Snowflake stores data in micro-partitions; clustering keys replace hash distribution for big tables.
  claim:
    text: Snowflake stores table data in micro-partitions rather than user-managed static partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: *id001
    confidence: high
- source_object: Clustered columnstore index
  target_object: Micro-partition pruning
  notes: No explicit index object; Snowflake prunes micro-partitions automatically.
  claim:
    text: Snowflake stores table data in micro-partitions rather than user-managed static partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: *id001
    confidence: high
- source_object: Stored procedure (T-SQL)
  target_object: Snowflake Scripting procedure
  notes: Rewrite T-SQL procedures in Snowflake Scripting or supported languages.
  claim:
    text: Snowflake stored procedures support branching, looping and other programmatic constructs.
    url: https://docs.snowflake.com/en/developer-guide/stored-procedure/stored-procedures-overview
    accessed: *id001
    confidence: high
- source_object: Materialized view
  target_object: Materialized view
  notes: Snowflake materialized views exist.
  claim:
    text: A Snowflake materialized view is a pre-computed data set stored for later use, requiring Enterprise Edition.
    url: https://docs.snowflake.com/en/user-guide/views-materialized
    accessed: *id001
    confidence: high
- source_object: IDENTITY column
  target_object: Sequence
  notes: Snowflake supports identity-style columns.
  claim:
    text: Snowflake CREATE SEQUENCE creates a sequence generating sequential, unique numbers (gaps not guaranteed).
    url: https://docs.snowflake.com/en/sql-reference/sql/create-sequence
    accessed: *id001
    confidence: high
- source_object: MERGE statement
  target_object: MERGE
  notes: Snowflake supports MERGE.
  claim:
    text: Snowflake MERGE inserts, updates and deletes values in a table based on values in a second table or subquery.
    url: https://docs.snowflake.com/en/sql-reference/sql/merge
    accessed: *id001
    confidence: high
