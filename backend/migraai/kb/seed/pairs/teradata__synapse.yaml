source: teradata
target: synapse
architecture_overview:
- text: Teradata PE and AMP vprocs share neither memory nor disk, giving a shared-nothing design.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
  accessed: '2026-10-15'
  confidence: high
- text: Azure Synapse dedicated SQL pool is an MPP engine where a control node distributes work to compute nodes over 60 distributions.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool tables are hash-distributed, round-robin or replicated.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-distribute
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Teradata row partitioning (PPI) enables row partition elimination for large query gains.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Primary-Index-Primary-AMP-Index-and-NoPI-Objects/Advantages-and-Disadvantages-of-Partitioned-Primary-Indexes
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool tables default to clustered columnstore indexes.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-index
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Choosing primary indexes so joined rows hash to the same AMP avoids redistributing rows across the BYNET.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool compute is scaled by changing data warehouse units (DWUs) and can be paused.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Teradata row level security controls access per row and per SQL operation by comparing user and row security labels.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Security-Administration/Implementing-Row-Level-Security/Row-Level-Security
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool supports Microsoft Entra authentication, row-level security and dynamic data masking.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Teradata balances work by spreading rows evenly across AMPs, each solely responsible for its own data.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool compute is scaled by changing data warehouse units (DWUs) and can be paused.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Teradata resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Synapse, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Synapse instead of copying Teradata structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
