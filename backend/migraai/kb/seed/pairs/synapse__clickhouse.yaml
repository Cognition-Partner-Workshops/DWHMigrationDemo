risks:
  sql:
    level: high
    notes: No T-SQL procedures; significant dialect and feature translation.
  data:
    level: medium
    notes: Update-heavy workloads fit poorly; redesign ingestion.
  security:
    level: medium
    notes: Auth and row policies differ from Synapse CLS/RLS model.
  governance:
    level: medium
    notes: Self-managed governance vs Azure platform governance.
  platform:
    level: high
    notes: Capacity model and operational ownership change entirely.
  operational:
    level: medium
    notes: Cluster operations and mutations need new runbooks.
