risks:
  sql:
    level: high
    notes: PL/SQL to T-SQL plus Synapse limits (no FK/triggers/sequences, nesting cap).
  data:
    level: medium
    notes: Distribution and CCI decisions drive performance.
  security:
    level: medium
    notes: VPD/grants map to CLS/roles; auth via Entra or SQL.
  governance:
    level: medium
    notes: Workspace governance differs from Oracle schema model.
  platform:
    level: high
    notes: MPP appliance model replaces RAC/instance architecture.
  operational:
    level: medium
    notes: DWU sizing, pause/resume and DMV monitoring are new.
