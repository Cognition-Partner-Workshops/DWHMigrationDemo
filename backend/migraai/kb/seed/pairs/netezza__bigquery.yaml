source: netezza
target: bigquery
architecture_overview:
- text: Netezza spreads processing across SPUs that each own memory and data slices in a shared-nothing design.
  url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery is a fully managed, serverless data warehouse that separates storage and compute.
  url: https://cloud.google.com/bigquery/docs/introduction
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery stores table data in a columnar format.
  url: https://cloud.google.com/bigquery/docs/storage_overview
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Netezza zone maps let the storage manager skip table extents that cannot contain rows matching a restricted scan.
    url: https://www.ibm.com/docs/en/netezza?topic=statistics-zone-maps
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery stores table data in a columnar format.
    url: https://cloud.google.com/bigquery/docs/storage_overview
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Tables that are commonly joined should be distributed on the join column so Netezza can run a collocated join without moving data between SPUs.
    url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
    accessed: '2026-10-15'
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute queries.
    url: https://cloud.google.com/bigquery/docs/slots
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: In Netezza, privileges granted to a group are inherited by all its members and are additive.
    url: https://www.ibm.com/docs/en/netezza?topic=control-security-model
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery access is controlled with IAM roles and permissions on projects, datasets and tables.
    url: https://cloud.google.com/bigquery/docs/access-control
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Netezza tables are distributed with DISTRIBUTE ON (columns) for hash distribution or DISTRIBUTE ON RANDOM for random distribution.
    url: https://www.ibm.com/docs/en/netezza?topic=databases-distribution-keys
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery is a fully managed, serverless data warehouse that separates storage and compute.
    url: https://cloud.google.com/bigquery/docs/introduction
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Netezza resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into BigQuery, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for BigQuery instead of copying Netezza structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
