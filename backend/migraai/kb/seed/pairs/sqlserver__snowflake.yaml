source: sqlserver
target: snowflake
architecture_overview:
- text: A page is a fundamental unit of data storage in the SQL Server Database Engine.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/pages-and-extents-architecture-guide?view=sql-server-ver17
  accessed: &id001 2026-10-15
  confidence: high
- text: A columnstore index stores, retrieves and manages data in a columnar format.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: Snowflake's architecture is a hybrid of traditional shared-disk and shared-nothing database architectures.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: *id001
  confidence: high
- text: Snowflake is a self-managed cloud service with no hardware or software to install, configure or manage.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: A clustered index sorts and stores table rows by its key values, and a table can have only one clustered index.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/clustered-and-nonclustered-indexes-described?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Snowflake stores table data in micro-partitions rather than user-managed static partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: *id001
    confidence: high
  compute:
  - text: The max degree of parallelism (MAXDOP) option limits the number of processors used for a parallel plan.
    url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/configure-the-max-degree-of-parallelism-server-configuration-option?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Virtual warehouses provide the compute required for queries and all DML operations including data loading.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: *id001
    confidence: high
  - text: A warehouse can be resized at any time, even while running, to add or remove compute resources.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: *id001
    confidence: high
  security:
  - text: Row-level security uses group membership or execution context to control access to table rows.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Snowflake access control assigns privileges to roles, which are assigned to users (RBAC).
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: *id001
    confidence: high
  scalability:
  - text: Partitioned table and index data is divided into units that can be spread across multiple filegroups or kept in one.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Multi-cluster warehouses let Snowflake scale compute resources for concurrency needs.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: *id001
    confidence: high
recommended_strategy: Inventory objects with sys tables/SSMS reports, convert the schema and T-SQL code objects with SnowConvert, move data to cloud staging and load with COPY INTO, then validate. Rebuild SSIS packages as Snowflake tasks/streams or a partner ETL tool, and remap SQL Server roles to Snowflake RBAC.
object_mapping:
- source_object: Stored procedure (T-SQL)
  target_object: Stored procedure (Snowflake Scripting or a supported language handler)
  notes: T-SQL control flow must be rewritten.
  claim:
    text: Snowflake Scripting is an extension to Snowflake SQL that adds procedural logic for stored procedures and UDFs.
    url: https://docs.snowflake.com/en/developer-guide/snowflake-scripting/index
    accessed: *id001
    confidence: high
- source_object: User-defined function
  target_object: UDF (SQL, JavaScript, etc.)
  notes: Scalar and table UDFs map to Snowflake UDFs.
  claim:
    text: Snowflake Scripting is an extension to Snowflake SQL that adds procedural logic for stored procedures and UDFs.
    url: https://docs.snowflake.com/en/developer-guide/snowflake-scripting/index
    accessed: *id001
    confidence: high
- source_object: Indexed view
  target_object: Materialized view
  notes: Indexed views become materialized views (Enterprise Edition).
  claim:
    text: A Snowflake materialized view is a pre-computed data set stored for later use, requiring Enterprise Edition.
    url: https://docs.snowflake.com/en/user-guide/views-materialized
    accessed: *id001
    confidence: high
- source_object: Trigger
  target_object: Stream + task
  notes: No DML triggers in Snowflake; streams plus scheduled tasks emulate them.
  claim:
    text: A stream object records DML changes (inserts, updates, deletes) made to a table — Snowflake's change data capture.
    url: https://docs.snowflake.com/en/user-guide/streams-intro
    accessed: *id001
    confidence: high
- source_object: Sequence
  target_object: Sequence
  notes: Sequences exist in both; check gap behaviour on failover.
  claim:
    text: Snowflake CREATE SEQUENCE creates a sequence generating sequential, unique numbers (gaps not guaranteed).
    url: https://docs.snowflake.com/en/sql-reference/sql/create-sequence
    accessed: *id001
    confidence: high
