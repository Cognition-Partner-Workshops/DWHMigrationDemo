risks:
  sql:
    level: medium
    notes: T-SQL procedural code (procedures, triggers, functions) needs Snowflake Scripting rewrite; TOP/DATEDIFF/ISNULL semantics differ.
  data:
    level: low
    notes: Datetime precision and collation differences are the main data-risk areas.
  security:
    level: medium
    notes: SQL logins/roles map to Snowflake users/roles; RLS/DDM map to row access policies and masking policies.
  governance:
    level: low
    notes: Catalog and lineage tooling differ; plan metadata capture separately.
  platform:
    level: medium
    notes: Moving from a single-instance engine to a SaaS MPP service changes ops model and cost controls.
  operational:
    level: low
    notes: Warehouse sizing and credit governance replace instance monitoring.
