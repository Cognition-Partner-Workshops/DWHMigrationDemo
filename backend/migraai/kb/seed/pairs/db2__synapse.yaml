source: db2
target: synapse
architecture_overview:
- text: A Db2 Warehouse MPP cluster scales out by adding data nodes with minimal interruption.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
  accessed: '2026-10-15'
  confidence: high
- text: Azure Synapse dedicated SQL pool is an MPP engine where a control node distributes work to compute nodes over 60 distributions.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool tables are hash-distributed, round-robin or replicated.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-distribute
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Db2 CREATE TABLE has an ORGANIZE BY clause to choose column- or row-organized storage.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool tables default to clustered columnstore indexes.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-index
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Db2 workload management uses DDL objects such as service classes, workloads, thresholds and work action sets.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=identification-workload-management-ddl-statements
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool compute is scaled by changing data warehouse units (DWUs) and can be paused.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Db2 Warehouse row and column access control (RCAC) filters rows and masks columns per user as fine-grained access control.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool supports Microsoft Entra authentication, row-level security and dynamic data masking.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Db2 Warehouse MPP cluster needs at least three nodes (one head, two data) and an SMP deployment cannot be turned into MPP by adding nodes.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool compute is scaled by changing data warehouse units (DWUs) and can be paused.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Db2 Warehouse resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Synapse, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Synapse instead of copying Db2 Warehouse structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
object_mapping:
- source_object: Table (DISTRIBUTE BY / ORGANIZE BY)
  target_object: Hash-distributed columnstore table
  notes: ''
  claim:
    text: Synapse dedicated SQL pool tables are hash-distributed, round-robin or replicated.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-distribute
    accessed: '2026-10-15'
    confidence: high
- source_object: SQL procedure (SQL PL)
  target_object: T-SQL stored procedure
  notes: ''
  claim:
    text: Synapse dedicated SQL pool stored procedures support a subset of T-SQL features.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-stored-procedures
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC row permission
  target_object: Row-level security
  notes: ''
  claim:
    text: Synapse dedicated SQL pool supports Microsoft Entra authentication, row-level security and dynamic data masking.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC column mask
  target_object: Dynamic data masking
  notes: ''
  claim:
    text: Synapse dedicated SQL pool supports Microsoft Entra authentication, row-level security and dynamic data masking.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: '2026-10-15'
    confidence: high
- source_object: Informational constraint
  target_object: NOT ENFORCED PRIMARY KEY / UNIQUE
  notes: ''
  claim:
    text: Synapse dedicated SQL pool supports primary key and unique constraints only as NOT ENFORCED and has no foreign keys.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-table-constraints
    accessed: '2026-10-15'
    confidence: high
- source_object: External table
  target_object: External table / COPY load
  notes: ''
  claim:
    text: Synapse recommends ELT loading with PolyBase or the COPY statement from Azure storage.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/design-elt-data-loading
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Db2 Warehouse accepts the Oracle (+) outer join operator in WHERE predicates.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 Warehouse supports Oracle-style hierarchical (recursive) queries.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 DECODE compares an expression with search values and returns the matching result.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=functions-decode
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool stored procedures support a subset of T-SQL features.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-stored-procedures
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool supports a subset of SQL Server data types.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-data-types
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool supports table partitioning on a single column, usually a date.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-partition
  accessed: '2026-10-15'
  confidence: high
data_movement:
