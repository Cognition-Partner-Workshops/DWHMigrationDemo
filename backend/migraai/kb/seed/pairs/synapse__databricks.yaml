risks:
  sql:
    level: high
    notes: T-SQL surface differs despite shared syntax; procedure nesting and labels need rewriting.
  data:
    level: medium
    notes: Distribution keys map to clustering decisions that affect performance.
  security:
    level: medium
    notes: CLS/RLS map to Unity Catalog privileges and row filters — full re-model needed.
  governance:
    level: medium
    notes: Unity Catalog replaces Synapse workspace governance.
  platform:
    level: high
    notes: Paradigm shift from MPP appliance model to lakehouse; DWU sizing replaced by warehouse sizing.
  operational:
    level: medium
    notes: Monitoring moves from DMVs to system tables and Lakeflow observability.
