risks:
  sql:
    level: high
    notes: PL/SQL to PL/pgSQL is a real port; SCT automates but manual fixes remain.
  data:
    level: medium
    notes: DISTKEY/SORTKEY modeling differs from Oracle partitioning.
  security:
    level: medium
    notes: VPD → Redshift RLS; auth model changes to IAM.
  governance:
    level: low
    notes: Align to AWS governance services.
  platform:
    level: high
    notes: RAC/DR concepts replaced by RA3/serverless architecture.
  operational:
    level: medium
    notes: 'New ops model: WLM, snapshots, DMS replication.'
