risks:
  sql:
    level: high
    notes: T-SQL vs PostgreSQL-derived SQL; procedural code must be ported.
  data:
    level: medium
    notes: DISTKEY/SORTKEY choices differ from Synapse distribution heuristics.
  security:
    level: medium
    notes: Auth model changes from Entra/SQL to IAM-based Redshift auth.
  governance:
    level: low
    notes: Align on AWS governance (Lake Formation/CloudTrail).
  platform:
    level: medium
    notes: DWU sizing replaced by node types or serverless RPUs.
  operational:
    level: low
    notes: WLM monitoring replaces DMV-based workload tracking.
