risks:
  sql:
    level: high
    notes: PL/SQL packages, autonomous transactions, CONNECT BY and '' = NULL semantics all require rework.
  data:
    level: medium
    notes: DATE-carries-time and character-set differences need type review.
  security:
    level: medium
    notes: VPD and fine-grained grants map to UC row filters/column masks.
  governance:
    level: medium
    notes: Unity Catalog model differs from schema-owner model.
  platform:
    level: high
    notes: RAC/instance model replaced by serverless lakehouse compute.
  operational:
    level: medium
    notes: Scheduler/jobs move to Lakeflow orchestration.
