risks:
  sql:
    level: high
    notes: PL/SQL to T-SQL port plus Fabric surface gaps (no triggers/MVs/recursion).
  data:
    level: medium
    notes: Type mappings (NVARCHAR2→varchar, DATE→datetime2) need review.
  security:
    level: medium
    notes: VPD/roles map to RLS/CLS/Entra model.
  governance:
    level: medium
    notes: Fabric workspace governance replaces schema-level model.
  platform:
    level: high
    notes: Full platform change to SaaS lakehouse.
  operational:
    level: medium
    notes: 'New ops surface: capacity units, pipelines, monitoring.'
