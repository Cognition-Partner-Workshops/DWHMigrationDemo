recommended_strategy: Extract Oracle tables via ADF/Fabric pipelines (Oracle connector) or Data Pump export, land them in a Fabric warehouse as Delta-backed tables, and translate PL/SQL to T-SQL (SSMA for Oracle accelerates this on the SQL-family side). Map VPD to row-level security and grants to workspace/item roles; plan around Fabric's T-SQL surface gaps (no triggers, no MVs).
object_mapping:
- source_object: Heap-organized table
  target_object: Warehouse table
  notes: Tables land as Delta files in OneLake.
  claim:
    text: 'Warehouse data is stored in Delta tables: Parquet data files plus a file-based transaction log.'
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
    accessed: *id001
    confidence: high
- source_object: Partitioned table
  target_object: Warehouse table + V-order
  notes: Partitioning maps to data layout choices.
  claim:
    text: V-Order is a write-time optimisation of the Parquet file format for faster reads in Fabric.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/v-order
    accessed: *id001
    confidence: high
- source_object: Materialized view
  target_object: Not supported — precomputed table
  notes: MVs absent; use tables + pipelines.
  claim:
    text: Materialized views are not supported in Fabric Warehouse.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: *id001
    confidence: high
- source_object: Package (PL/SQL)
  target_object: Stored procedures (T-SQL)
  notes: SSMA converts PL/SQL to T-SQL.
  claim:
    text: Fabric Data Warehouse supports T-SQL tables, views, stored procedures, functions, permissions and security roles.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: *id001
    confidence: high
- source_object: Sequence
  target_object: IDENTITY column
  notes: Sequences unsupported; use IDENTITY.
  claim:
    text: In Fabric Data Warehouse, IDENTITY columns automatically generate new numeric values on insert.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
    accessed: *id001
    confidence: high
- source_object: Synonym
  target_object: View
  notes: Synonyms are unsupported in Fabric Warehouse; create views instead.
  claim:
    text: Synonyms appear in Fabric Warehouse's T-SQL surface-area unsupported-features list.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: *id001
    confidence: medium
- source_object: MERGE statement
  target_object: MERGE
  notes: MERGE supported in Fabric warehouse.
  claim:
    text: The T-SQL MERGE reference applies to Warehouse in Microsoft Fabric and runs insert, update, or delete operations on a target table.
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/merge-transact-sql?view=azure-sqldw-latest
    accessed: *id001
    confidence: high
sql_dialect_differences:
