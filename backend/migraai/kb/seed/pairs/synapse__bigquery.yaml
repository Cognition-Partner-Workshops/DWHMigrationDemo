risks:
  sql:
    level: high
    notes: T-SQL to GoogleSQL is a real dialect translation; translator tooling helps but manual rework remains.
  data:
    level: medium
    notes: Distribution → partition/cluster modeling decisions.
  security:
    level: medium
    notes: Entra/SQL auth maps to GCP IAM; plan migration of grants.
  governance:
    level: medium
    notes: Dataplex/org policy model differs from Synapse workspace.
  platform:
    level: medium
    notes: DWU model replaced by slots/on-demand.
  operational:
    level: low
    notes: Monitoring via Cloud Monitoring instead of DMVs.
