source: synapse
target: bigquery
architecture_overview:
- text: Dedicated SQL pool uses a scale-out architecture that spreads computational processing across multiple nodes.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: &id001 2026-10-15
  confidence: high
- text: The control node receives queries, optimises them for parallel execution and hands the work to compute nodes.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: *id001
  confidence: high
- text: BigQuery is a fully managed, AI-ready data platform with a serverless architecture.
  url: https://docs.cloud.google.com/bigquery/docs/introduction
  accessed: *id001
  confidence: high
- text: BigQuery separates storage and compute, scaling each independently, and executes queries completely in memory across parallel workers.
  url: https://docs.cloud.google.com/bigquery/docs/storage_overview
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: Tables get a clustered columnstore index by default when no index option is specified in dedicated SQL pool.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-index
    accessed: *id001
    confidence: high
  - text: A partitioned table in BigQuery is divided into segments called partitions, enabling partition pruning on the partitioning column.
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
    accessed: *id001
    confidence: high
  - text: A clustered table in BigQuery sorts storage blocks by user-defined clustered columns to reduce scanned bytes.
    url: https://docs.cloud.google.com/bigquery/docs/clustered-tables
    accessed: *id001
    confidence: high
  compute:
  - text: Compute power in dedicated SQL pool is measured and scaled in data warehouse units (DWUs).
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: *id001
    confidence: high
  - text: Workload management in dedicated SQL pool uses workload classification, importance and isolation to manage resources.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-workload-management
    accessed: *id001
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute SQL queries.
    url: https://docs.cloud.google.com/bigquery/docs/slots
    accessed: *id001
    confidence: high
  security:
  - text: Column-level security restricts access to table columns based on the user's execution context or group membership.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/column-level-security
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool supports both SQL authentication and Microsoft Entra ID authentication.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-authentication
    accessed: *id001
    confidence: high
  - text: BigQuery access control uses Identity and Access Management (IAM) predefined roles and permissions.
    url: https://docs.cloud.google.com/bigquery/docs/access-control
    accessed: *id001
    confidence: high
  scalability:
  - text: In dedicated SQL pool compute is separate from storage, so compute can be scaled independently of the data held.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
    accessed: *id001
    confidence: high
  - text: Dedicated SQL pool compute resources can be paused and resumed.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: *id001
    confidence: high
  - text: BigQuery separates storage and compute, scaling each independently, and executes queries completely in memory across parallel workers.
    url: https://docs.cloud.google.com/bigquery/docs/storage_overview
    accessed: *id001
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute SQL queries.
    url: https://docs.cloud.google.com/bigquery/docs/slots
    accessed: *id001
    confidence: high
recommended_strategy: Unload dedicated-pool tables to storage, recreate them as partitioned/clustered BigQuery tables, translate T-SQL to GoogleSQL (batch SQL translator accelerates this), and load via the BigQuery Data Transfer Service or batch loads. Replace DWU/resource classes with slot reservations or on-demand pricing, and remap security to IAM, column-level security and row access policies.
object_mapping:
- source_object: Distributed table
  target_object: Partitioned + clustered table
  notes: Hash distribution maps to partitioning/clustering decisions.
  claim:
    text: A clustered table in BigQuery sorts storage blocks by user-defined clustered columns to reduce scanned bytes.
    url: https://docs.cloud.google.com/bigquery/docs/clustered-tables
    accessed: *id001
    confidence: high
- source_object: Clustered columnstore index
  target_object: Clustering + partitioning
  notes: No index DDL; layout is managed.
  claim:
    text: A partitioned table in BigQuery is divided into segments called partitions, enabling partition pruning on the partitioning column.
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
    accessed: *id001
    confidence: high
- source_object: Stored procedure (T-SQL)
  target_object: BigQuery procedure (GoogleSQL scripting)
  notes: Procedures exist in GoogleSQL.
  claim:
    text: A BigQuery stored procedure is a collection of statements that supports procedural language statements.
    url: https://docs.cloud.google.com/bigquery/docs/procedures
    accessed: *id001
    confidence: high
- source_object: Materialized view
  target_object: Materialized view
  notes: BQ MVs supported.
  claim:
    text: BigQuery materialized views are precomputed tables that optimize query performance and reduce execution costs.
    url: https://docs.cloud.google.com/bigquery/docs/materialized-views-intro
    accessed: *id001
    confidence: high
- source_object: IDENTITY column
  target_object: GENERATED identity column
  notes: BQ supports identity columns.
  claim:
    text: BigQuery column definitions support GENERATED ALWAYS or BY DEFAULT AS IDENTITY.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language
    accessed: *id001
    confidence: high
- source_object: MERGE statement
  target_object: MERGE
  notes: BigQuery supports MERGE.
  claim:
    text: BigQuery's MERGE statement combines INSERT, UPDATE and DELETE operations into a single atomic statement.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/dml-syntax
    accessed: *id001
    confidence: high
sql_dialect_differences:
- text: CREATE TABLE AS SELECT (CTAS) creates and populates a new table from a SELECT in one parallel operation.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-ctas
  accessed: *id001
  confidence: high
- text: Dedicated SQL pool supports WHILE loops for repeating a block of statements.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-loops
  accessed: *id001
  confidence: high
- text: Dedicated SQL pool allows at most eight levels of stored procedure nesting.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-develop-stored-procedures
  accessed: *id001
  confidence: high
- text: The T-SQL MERGE reference applies MERGE to dedicated SQL pool with no preview flag; the Synapse overview-features page lists it as 'Yes (preview)' — docs disagree.
  url: https://learn.microsoft.com/en-us/sql/t-sql/statements/merge-transact-sql?view=azure-sqldw-latest
  accessed: *id001
  confidence: low
- text: A BigQuery stored procedure is a collection of statements that supports procedural language statements.
  url: https://docs.cloud.google.com/bigquery/docs/procedures
  accessed: *id001
  confidence: high
- text: The GoogleSQL procedural language executes multiple statements in one query as a multi-statement query.
  url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language
  accessed: *id001
  confidence: high
- text: BigQuery does not enforce primary and foreign key constraints; they exist for query optimization.
