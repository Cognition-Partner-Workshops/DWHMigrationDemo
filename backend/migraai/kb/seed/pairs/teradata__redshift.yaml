    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: A Teradata macro is one or more SQL statements run as a single request.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Introduction/Database-Objects-Databases-and-Users/Macros
  accessed: '2026-10-15'
  confidence: high
- text: Teradata ZEROIFNULL converts null to 0.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/SQL-Functions-Expressions-and-Predicates/Arithmetic-Trigonometric-Hyperbolic-Operators/Functions/ZEROIFNULL
  accessed: '2026-10-15'
  confidence: high
- text: Teradata OREPLACE replaces every occurrence of a search string.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/SQL-Functions-Expressions-and-Predicates/String-Operators-and-Functions/OREPLACE
  accessed: '2026-10-15'
  confidence: high
- text: Redshift supports the QUALIFY clause to filter on window function results.
  url: https://docs.aws.amazon.com/redshift/latest/dg/r_QUALIFY_clause.html
  accessed: '2026-10-15'
  confidence: high
- text: Redshift MERGE conditionally inserts, updates or deletes target rows from a source table.
  url: https://docs.aws.amazon.com/redshift/latest/dg/r_MERGE.html
  accessed: '2026-10-15'
  confidence: high
- text: Redshift does not support PostgreSQL types such as arrays, XML and UUID.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_unsupported-postgresql-datatypes.html
  accessed: '2026-10-15'
  confidence: high
