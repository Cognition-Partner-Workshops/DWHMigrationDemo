risks:
  sql:
    level: low
    notes: Same T-SQL dialect, but a subset of types and features (triggers, MVs, recursion) is missing.
  data:
    level: low
    notes: Unsupported types (datetime, nvarchar, money) need explicit conversion; watch collation/storage differences.
  security:
    level: medium
    notes: Security moves to workspace/item permissions plus granular SQL permissions and Entra auth.
  governance:
    level: low
    notes: OneLake/Fabric governance model centralizes estate.
  platform:
    level: medium
    notes: SaaS capacity model (CU seconds, smoothing/throttling) replaces instance sizing.
  operational:
    level: low
    notes: Session limits (2048/workspace) and throttling need capacity planning.
