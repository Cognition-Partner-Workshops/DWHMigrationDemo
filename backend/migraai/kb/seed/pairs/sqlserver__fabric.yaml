recommended_strategy: 'Both platforms speak T-SQL, so this is the lowest-friction target: use the Fabric Migration Assistant (DACPAC upload) or mirrored databases for near-real-time replication, ingest historical data with COPY INTO, and fix flagged gaps (unsupported types like datetime/nvarchar, triggers, materialized views). Map SQL logins to Microsoft Entra and warehouse/workspace permissions.'
object_mapping:
- source_object: Stored procedure (T-SQL)
  target_object: Stored procedure (T-SQL)
  notes: Direct port; check surface-area limitations.
  claim:
    text: Fabric Data Warehouse supports T-SQL tables, views, stored procedures, functions, permissions and security roles.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: *id001
    confidence: high
- source_object: Table
  target_object: Warehouse table (Delta/Parquet in OneLake)
  notes: Storage layer changes to Delta files.
  claim:
    text: 'Warehouse data is stored in Delta tables: Parquet data files plus a file-based transaction log.'
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
    accessed: *id001
    confidence: high
- source_object: Indexed view / materialized view
  target_object: View
  notes: Materialized views are not supported.
  claim:
    text: Materialized views are not supported in Fabric Warehouse.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: *id001
    confidence: high
- source_object: Trigger
  target_object: None — redesign
  notes: Triggers are not supported in Fabric Warehouse.
  claim:
    text: Triggers are not supported in Fabric Warehouse.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: *id001
    confidence: high
- source_object: Primary key / foreign key
  target_object: NONCLUSTERED NOT ENFORCED key
  notes: Keys exist for metadata only.
  claim:
    text: PRIMARY KEY, UNIQUE and FOREIGN KEY constraints in Fabric Warehouse are supported only when declared NOT ENFORCED.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
    accessed: *id001
    confidence: high
- source_object: CTAS
  target_object: CREATE TABLE AS SELECT
  notes: CTAS is supported for table creation from a query.
  claim:
    text: CREATE TABLE AS SELECT (CTAS) creates a new Fabric warehouse table from a query.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data-tsql
    accessed: *id001
    confidence: high
