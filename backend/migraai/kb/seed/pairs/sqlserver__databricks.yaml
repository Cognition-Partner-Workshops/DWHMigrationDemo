source: sqlserver
target: databricks
architecture_overview:
- text: A page is a fundamental unit of data storage in the SQL Server Database Engine.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/pages-and-extents-architecture-guide?view=sql-server-ver17
  accessed: &id001 2026-10-15
  confidence: high
- text: A columnstore index stores, retrieves and manages data in a columnar format.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: Delta Lake is the default format for all tables on Databricks.
  url: https://docs.databricks.com/aws/en/delta
  accessed: *id001
  confidence: high
- text: Every governed asset in Unity Catalog is modeled as a securable object on which permissions can be granted.
  url: https://docs.databricks.com/aws/en/data-governance/unity-catalog
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: A clustered index sorts and stores table rows by its key values, and a table can have only one clustered index.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/clustered-and-nonclustered-indexes-described?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Delta Lake is the default format for all tables on Databricks.
    url: https://docs.databricks.com/aws/en/delta
    accessed: *id001
    confidence: high
  - text: Liquid clustering lets you redefine clustering keys without rewriting existing data, and is recommended for all new tables.
    url: https://docs.databricks.com/aws/en/tables/clustering
    accessed: *id001
    confidence: high
  compute:
  - text: Resource governor manages Database Engine resource consumption and enforces policies for user workloads.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Serverless SQL warehouses use Intelligent Workload Management (IWM) to automatically manage query workloads.
    url: https://docs.databricks.com/aws/en/compute/sql-warehouse/warehouse-behavior
    accessed: *id001
    confidence: high
  security:
  - text: Row-level security uses group membership or execution context to control access to table rows.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Every governed asset in Unity Catalog is modeled as a securable object on which permissions can be granted.
    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog
    accessed: *id001
    confidence: high
  - text: Unity Catalog supports row filters and column masks for fine-grained table access control.
    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks
    accessed: *id001
    confidence: high
  scalability:
  - text: Partitioned table and index data is divided into units that can be spread across multiple filegroups or kept in one.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Serverless SQL warehouses use Intelligent Workload Management (IWM) to automatically manage query workloads.
    url: https://docs.databricks.com/aws/en/compute/sql-warehouse/warehouse-behavior
    accessed: *id001
    confidence: high
recommended_strategy: Convert schema and T-SQL code to Databricks SQL, land data in cloud object storage and ingest into Delta tables (or use Lakeflow Connect managed CDC for ongoing sync), then rebuild SSIS workloads as Lakeflow pipelines or jobs. Map SQL Server security to Unity Catalog grants, row filters and column masks.
object_mapping:
- source_object: Stored procedure (T-SQL)
  target_object: Stored procedure (SQL/PSM scripting)
  notes: SQL scripting supports BEGIN...END compounds, loops and handlers.
  claim:
    text: Databricks supports procedural logic using SQL/PSM standard-based scripting syntax (Databricks Runtime 16.3+).
    url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-scripting
    accessed: *id001
    confidence: high
- source_object: User-defined function
  target_object: SQL/Python UDF
  notes: Map scalar and table UDFs to Databricks SQL functions.
  claim:
    text: Databricks supports procedural logic using SQL/PSM standard-based scripting syntax (Databricks Runtime 16.3+).
    url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-scripting
    accessed: *id001
    confidence: high
- source_object: Indexed view
  target_object: Materialized view
  notes: Incremental refresh via Lakeflow declarative pipelines.
  claim:
    text: A standalone materialized view is a Unity Catalog managed table that physically stores the results of a query.
    url: https://docs.databricks.com/aws/en/ldp/dbsql/materialized
    accessed: *id001
    confidence: high
- source_object: Trigger
  target_object: Pipeline / streaming table logic
  notes: No DML triggers; reimplement in pipelines.
  claim:
    text: A standalone materialized view is a Unity Catalog managed table that physically stores the results of a query.
    url: https://docs.databricks.com/aws/en/ldp/dbsql/materialized
    accessed: *id001
    confidence: high
- source_object: Table
  target_object: Delta Lake table (Unity Catalog managed)
  notes: All Databricks tables default to Delta format.
  claim:
    text: Delta Lake is the default format for all tables on Databricks.
    url: https://docs.databricks.com/aws/en/delta
    accessed: *id001
    confidence: high
- source_object: CDC capture tables
  target_object: Lakeflow Connect ingestion pipeline
  notes: Managed CDC connector replaces homegrown extraction.
  claim:
    text: Lakeflow Connect provides managed CDC ingestion pipelines from SQL Server into Databricks, in gateway-based or integrated CDC mode.
    url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-overview
    accessed: *id001
    confidence: high
sql_dialect_differences:
- text: TOP limits the rows returned by a query to a number or percentage of rows.
  url: https://learn.microsoft.com/en-us/sql/t-sql/queries/top-transact-sql?view=sql-server-ver17
