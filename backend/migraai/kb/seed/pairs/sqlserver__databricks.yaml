- text: Databricks uses the LIMIT clause to constrain the number of rows returned by a query.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-limit
  accessed: *id001
  confidence: high
- text: MERGE runs insert, update or delete operations on a target table from a join with a source table.
  url: https://learn.microsoft.com/en-us/sql/t-sql/statements/merge-transact-sql?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: MERGE merges updates, insertions and deletions from a source into a target Delta table; it is supported only for Delta Lake tables.
