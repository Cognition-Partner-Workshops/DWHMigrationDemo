risks:
  sql:
    level: high
    notes: T-SQL procedures and functions convert to SQL/PSM scripting or Python — sizeable rewrite surface.
  data:
    level: low
    notes: Type mapping is straightforward; watch datetime2→timestamp precision and collation.
  security:
    level: medium
    notes: Instance-level security model moves to Unity Catalog securables, row filters and column masks.
  governance:
    level: low
    notes: Unity Catalog provides lineage; register all migrated objects under it.
  platform:
    level: high
    notes: Architecture shift from SMP engine to Spark/Delta lakehouse requires re-training and workload redesign.
  operational:
    level: low
    notes: Serverless warehouses reduce infra ops; monitor with system tables.
