    text: ReplacingMergeTree deduplicates by sorting key.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/replacingmergetree
    accessed: '2026-10-15'
    confidence: high
- source_object: LOAD DATA / INSERT OVERWRITE
  target_object: INSERT INTO ... SELECT FROM s3()
  notes: ''
