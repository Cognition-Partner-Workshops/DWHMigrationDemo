    text: The s3 table function reads files in S3.
    url: https://clickhouse.com/docs/reference/functions/table-functions/s3
    accessed: '2026-10-15'
    confidence: high
- source_object: EXTERNAL TABLE on HDFS
  target_object: s3 / iceberg table function
