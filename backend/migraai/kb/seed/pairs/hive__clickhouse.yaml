    text: JSON type stores JSON documents in a column.
    url: https://clickhouse.com/docs/reference/data-types/newjson
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Hive SORT BY orders rows only within each reducer, so output may be only partially ordered.
  url: https://hive.apache.org/docs/latest/language/languagemanual-sortby/
  accessed: '2026-10-15'
  confidence: high
- text: Hive LATERAL VIEW applies a UDTF such as explode() to each input row.
  url: https://hive.apache.org/docs/latest/language/languagemanual-lateralview/
  accessed: '2026-10-15'
  confidence: high
- text: HiveQL SELECT has non-standard CLUSTER BY, DISTRIBUTE BY and SORT BY clauses.
  url: https://hive.apache.org/docs/latest/language/languagemanual-select/
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse ALTER TABLE ... UPDATE is a mutation, a heavy operation not designed for frequent use.
  url: https://clickhouse.com/docs/reference/statements/alter/update
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse provides a lightweight DELETE statement.
  url: https://clickhouse.com/docs/reference/statements/delete
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse Decimal precision ranges from 1 to 76, default 10.
  url: https://clickhouse.com/docs/reference/data-types/decimal
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse String values have arbitrary length and can contain any bytes.
  url: https://clickhouse.com/docs/reference/data-types/string
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse columns are non-nullable unless declared Nullable(T).
  url: https://clickhouse.com/docs/reference/data-types/nullable
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse supports QUALIFY.
  url: https://clickhouse.com/docs/reference/statements/select/qualify
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: Hive LOAD DATA moves files into a table or partition without transformation.
  url: https://hive.apache.org/docs/latest/language/languagemanual-dml/
  accessed: '2026-10-15'
  confidence: high
- text: Hive EXPORT writes table or partition data plus metadata to an output location.
  url: https://hive.apache.org/docs/latest/language/languagemanual-importexport/
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse s3 table function reads and writes files in S3-compatible storage.
  url: https://clickhouse.com/docs/reference/functions/table-functions/s3
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse iceberg table function queries Apache Iceberg tables.
  url: https://clickhouse.com/docs/reference/functions/table-functions/iceberg
  accessed: '2026-10-15'
  confidence: high
- text: The ClickHouse Hive engine runs SELECT queries on HDFS Hive tables.
  url: https://clickhouse.com/docs/reference/engines/table-engines/integrations/hive
  accessed: '2026-10-15'
  confidence: high
- text: The ClickHouse hdfs table function creates a table from HDFS files.
  url: https://clickhouse.com/docs/reference/functions/table-functions/hdfs
  accessed: '2026-10-15'
  confidence: high
etl_migration:
- text: HPL/SQL provides procedural SQL for Hive from Hive 2.0.0.
  url: https://hive.apache.org/docs/latest/language/hplsql/
  accessed: '2026-10-15'
  applies_to: Hive 2.0+
  confidence: high
- text: Hive 4.0 added scheduled queries executed by HiveServer2.
  url: https://hive.apache.org/docs/latest/language/scheduled-queries/
  accessed: '2026-10-15'
  applies_to: Hive 4.0+
  confidence: high
- text: ClickHouse incremental materialized views move computation from query time to insert time.
  url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse views can be normal, materialized or refreshable materialized.
  url: https://clickhouse.com/docs/reference/statements/create/view
  accessed: '2026-10-15'
  confidence: high
security_migration:
- text: Hive SQL standard based authorization grants privileges to users and roles for HiveServer2 clients.
  url: https://hive.apache.org/docs/latest/language/sql-standard-based-hive-authorization/
  accessed: '2026-10-15'
  confidence: high
- text: Hive storage based authorization does not provide column- or row-level control.
  url: https://hive.apache.org/docs/latest/language/languagemanual-authorization/
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse supports row policies.
  url: https://clickhouse.com/docs/reference/statements/create/row-policy
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse Cloud documents database user management.
  url: https://clickhouse.com/docs/products/cloud/guides/security/cloud-access-management/manage-database-users
  accessed: '2026-10-15'
  confidence: high
unsupported_features:
- id: hive_uniontype
  claim:
    text: Hive UNIONTYPE is effectively pass-through only and fails in JOIN, WHERE or GROUP BY.
    url: https://hive.apache.org/docs/latest/language/languagemanual-types/
    accessed: '2026-10-15'
    confidence: high
- id: hive_sort_distribute_by
  claim:
    text: Hive SORT BY / DISTRIBUTE BY control per-reducer ordering and row distribution.
    url: https://hive.apache.org/docs/latest/language/languagemanual-sortby/
    accessed: '2026-10-15'
    confidence: high
- id: hive_no_explicit_txn
  claim:
    text: Hive has no BEGIN/COMMIT/ROLLBACK; every statement auto-commits.
    url: https://hive.apache.org/docs/latest/user/hive-transactions/
    accessed: '2026-10-15'
    confidence: high
- id: hive_hplsql
  claim:
    text: Hive stored procedures are written in HPL/SQL.
    url: https://hive.apache.org/docs/latest/language/hplsql/
    accessed: '2026-10-15'
    confidence: high
- id: ch_heavy_updates
  claim:
    text: ClickHouse UPDATE runs as an asynchronous mutation intended for infrequent use.
    url: https://clickhouse.com/docs/reference/statements/alter/update
    accessed: '2026-10-15'
    confidence: high
- id: ch_limited_txn
  claim:
    text: ClickHouse multi-statement transactions are experimental; single INSERTs are atomic.
    url: https://clickhouse.com/docs/concepts/features/operations/insert/transactions
    accessed: '2026-10-15'
    confidence: high
workarounds:
- for: hive_uniontype
  claim:
