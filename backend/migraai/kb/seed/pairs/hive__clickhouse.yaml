source: hive
target: clickhouse
architecture_overview:
- text: HiveServer2 runs a Thrift-based Hive service (TCP or HTTP) with a Jetty web UI in one process.
  url: https://hive.apache.org/docs/latest/user/hiveserver2-overview/
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse Cloud SharedMergeTree is a cloud-native replacement for ReplicatedMergeTree.
  url: https://clickhouse.com/docs/products/cloud/features/infrastructure/shared-merge-tree
  accessed: '2026-10-15'
  confidence: high
- text: A MergeTree primary key sets the sort order within each table part.
  url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Hive owns managed-table data (dropped with the table) but not external-table data.
    url: https://hive.apache.org/docs/latest/language/managed-vs--external-tables/
    accessed: '2026-10-15'
    confidence: high
  - text: MergeTree primary keys index 8192-row granules rather than individual rows.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Hive executes queries using Apache Tez or MapReduce.
    url: https://hive.apache.org/docs/latest/introduction-to-apache-hive/
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse Cloud idles and resumes compute automatically.
    url: https://clickhouse.com/docs/products/cloud/reference/architecture
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Hive storage based authorization relies on HDFS permissions and works at database, table and partition level.
    url: https://hive.apache.org/docs/latest/language/languagemanual-authorization/
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse uses RBAC-based access control.
    url: https://clickhouse.com/docs/concepts/features/security/access-rights
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Hive global ORDER BY needs a single reducer for the final sort.
    url: https://hive.apache.org/docs/latest/language/languagemanual-sortby/
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse primary indexes turn scans into fast binary searches with logarithmic runtime.
    url: https://clickhouse.com/docs/get-started/about/why-clickhouse-is-so-fast
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Extract Hive DDL, partitions and HPL/SQL scripts from the metastore and edge nodes, compact ACID tables, then copy ORC/Parquet files from HDFS to cloud object storage and load or register them in ClickHouse. Rewrite HiveQL-specific clauses (SORT BY, DISTRIBUTE BY, LATERAL VIEW, multi-insert), replace Oozie/scheduled queries with ClickHouse orchestration, map Ranger/SQL-standard grants to ClickHouse security, and validate partition-by-partition.
