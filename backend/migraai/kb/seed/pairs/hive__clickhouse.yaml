  target_object: MergeTree / SharedMergeTree table
  notes: ''
  claim:
    text: MergeTree primary key defines sort order in each part.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: '2026-10-15'
    confidence: high
- source_object: VIEW
  target_object: View
  notes: ''
  claim:
    text: ClickHouse supports normal views.
    url: https://clickhouse.com/docs/reference/statements/create/view
    accessed: '2026-10-15'
    confidence: high
- source_object: MATERIALIZED VIEW
  target_object: Refreshable or incremental materialized view
  notes: ''
  claim:
    text: ClickHouse supports materialized and refreshable materialized views.
    url: https://clickhouse.com/docs/reference/statements/create/view
    accessed: '2026-10-15'
    confidence: high
- source_object: HPL/SQL procedure
  target_object: Lambda UDF plus external orchestration
  notes: ''
  claim:
    text: ClickHouse UDFs are lambda expressions.
    url: https://clickhouse.com/docs/reference/statements/create/function
    accessed: '2026-10-15'
    confidence: high
- source_object: Scheduled query (Hive 4) / Oozie workflow
  target_object: Refreshable materialized view
