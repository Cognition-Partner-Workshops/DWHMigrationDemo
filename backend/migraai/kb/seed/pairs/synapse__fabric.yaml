risks:
  sql:
    level: low
    notes: Same T-SQL family; check tsql-surface-area gaps (triggers, MVs, recursion).
  data:
    level: low
    notes: Microsoft-guided migration path reduces data risk.
  security:
    level: low
    notes: CLS/RLS/DDM have direct Fabric counterparts; Entra-only auth.
  governance:
    level: low
    notes: Both Microsoft platforms; governance via Fabric workspace + Purview.
  platform:
    level: medium
    notes: DWU → capacity units; test workload fit in preview context.
  operational:
    level: low
    notes: Monitoring moves to Fabric capacity metrics.
