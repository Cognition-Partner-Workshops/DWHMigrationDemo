- text: Pipelines in Fabric Data Factory can ingest data into a Fabric warehouse.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data-pipelines
  accessed: *id001
  confidence: high
- text: The Fabric Migration Assistant migrates a warehouse by uploading a DACPAC file or a zip archive of .sql/.bteq files, then copies data with a copy job.
