    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks/
    accessed: '2026-10-15'
    confidence: high
- source_object: External table
  target_object: Foreign catalog (Lakehouse Federation)
  notes: ''
  claim:
    text: Databricks Lakehouse Federation queries external databases in place without moving the data.
    url: https://docs.databricks.com/aws/en/query-federation/
    accessed: '2026-10-15'
    confidence: high
- source_object: JSON / JSONB column
  target_object: STRUCT / ARRAY / MAP column
  notes: ''
  claim:
    text: Databricks SQL supports complex types ARRAY, MAP and STRUCT.
    url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-datatypes
    accessed: '2026-10-15'
    confidence: high
- source_object: Constraint clause (not enforced)
  target_object: Informational PRIMARY / FOREIGN KEY
  notes: ''
  claim:
    text: Databricks primary and foreign key constraints are informational and not enforced.
    url: https://docs.databricks.com/aws/en/tables/constraints
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Netezza DECODE compares an expression to search values and returns the matching result or a default.
  url: https://www.ibm.com/docs/en/netezza?topic=operators-functions
  accessed: '2026-10-15'
  confidence: high
- text: Netezza DATE_PART('field', value) extracts a datetime field like EXTRACT.
  url: https://www.ibm.com/docs/en/netezza?topic=operators-functions
  accessed: '2026-10-15'
  confidence: high
- text: Netezza INTERVAL (alias TIMESPAN) is a nonstandard implementation expressed in a single unit.
  url: https://www.ibm.com/docs/en/netezza?topic=types-temporal-data
  accessed: '2026-10-15'
  confidence: high
- text: Databricks SQL supports the QUALIFY clause to filter window function results.
