risks:
  sql:
    level: medium
    notes: Netezza extensions and procedural code need rewriting for Databricks.
  data:
    level: medium
    notes: Type differences (precision, time zones, large objects, semi-structured data) need per-column checks.
  security:
    level: medium
    notes: Grants and row/column rules must be re-implemented with the target security model.
  governance:
    level: low
    notes: Lineage, ownership and audit settings must be re-established on the target.
  platform:
    level: medium
    notes: Unenforced or missing constraints and different transaction semantics can change behaviour.
  operational:
    level: medium
    notes: Load jobs, scheduling and monitoring move to target-native tooling.
