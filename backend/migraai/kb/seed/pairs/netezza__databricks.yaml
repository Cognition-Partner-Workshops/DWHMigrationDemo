source: netezza
target: databricks
architecture_overview:
- text: Netezza spreads processing across SPUs that each own memory and data slices in a shared-nothing design.
  url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
  accessed: '2026-10-15'
  confidence: high
- text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
  url: https://docs.databricks.com/aws/en/delta/
  accessed: '2026-10-15'
  confidence: high
- text: A Databricks SQL warehouse is a compute resource for running SQL queries.
  url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Netezza zone maps let the storage manager skip table extents that cannot contain rows matching a restricted scan.
    url: https://www.ibm.com/docs/en/netezza?topic=statistics-zone-maps
    accessed: '2026-10-15'
    confidence: high
  - text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
    url: https://docs.databricks.com/aws/en/delta/
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Tables that are commonly joined should be distributed on the join column so Netezza can run a collocated join without moving data between SPUs.
    url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
    accessed: '2026-10-15'
    confidence: high
  - text: A Databricks SQL warehouse is a compute resource for running SQL queries.
    url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: In Netezza, privileges granted to a group are inherited by all its members and are additive.
    url: https://www.ibm.com/docs/en/netezza?topic=control-security-model
    accessed: '2026-10-15'
    confidence: high
  - text: Unity Catalog provides centralized access control, auditing and lineage across Databricks workspaces.
    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Netezza tables are distributed with DISTRIBUTE ON (columns) for hash distribution or DISTRIBUTE ON RANDOM for random distribution.
    url: https://www.ibm.com/docs/en/netezza?topic=databases-distribution-keys
    accessed: '2026-10-15'
    confidence: high
  - text: Databricks serverless compute is managed by Databricks and starts without customer-managed clusters.
    url: https://docs.databricks.com/aws/en/compute/serverless/
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Netezza resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Databricks, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Databricks instead of copying Netezza structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
object_mapping:
- source_object: TABLE (DISTRIBUTE ON)
  target_object: Delta table (Unity Catalog)
  notes: ''
  claim:
    text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
    url: https://docs.databricks.com/aws/en/delta/
    accessed: '2026-10-15'
    confidence: high
- source_object: Stored procedure (NZPLSQL)
  target_object: SQL stored procedure
  notes: ''
  claim:
    text: Databricks supports CREATE PROCEDURE for SQL stored procedures in Unity Catalog.
    url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-procedure
    accessed: '2026-10-15'
    confidence: high
- source_object: Row-secure table
  target_object: Row filter / column mask
  notes: ''
