source: teradata
target: snowflake
architecture_overview:
- text: Teradata PE and AMP vprocs share neither memory nor disk, giving a shared-nothing design.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake separates centralized storage from virtual warehouse compute in a hybrid shared-disk and shared-nothing design.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake stores table data in automatically managed micro-partitions.
  url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Teradata row partitioning (PPI) enables row partition elimination for large query gains.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Primary-Index-Primary-AMP-Index-and-NoPI-Objects/Advantages-and-Disadvantages-of-Partitioned-Primary-Indexes
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake stores table data in automatically managed micro-partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Choosing primary indexes so joined rows hash to the same AMP avoids redistributing rows across the BYNET.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake separates centralized storage from virtual warehouse compute in a hybrid shared-disk and shared-nothing design.
    url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Teradata row level security controls access per row and per SQL operation by comparing user and row security labels.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Security-Administration/Implementing-Row-Level-Security/Row-Level-Security
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake access control combines discretionary and role-based models, granting privileges to roles.
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Teradata balances work by spreading rows evenly across AMPs, each solely responsible for its own data.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: Snowflake multi-cluster warehouses add clusters automatically to handle query concurrency.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Teradata resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Snowflake, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Snowflake instead of copying Teradata structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
