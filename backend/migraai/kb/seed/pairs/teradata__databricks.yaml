source: teradata
target: databricks
architecture_overview:
- text: Teradata PE and AMP vprocs share neither memory nor disk, giving a shared-nothing design.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
  accessed: '2026-10-15'
  confidence: high
- text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
  url: https://docs.databricks.com/aws/en/delta/
  accessed: '2026-10-15'
  confidence: high
- text: A Databricks SQL warehouse is a compute resource for running SQL queries.
  url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Teradata row partitioning (PPI) enables row partition elimination for large query gains.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Primary-Index-Primary-AMP-Index-and-NoPI-Objects/Advantages-and-Disadvantages-of-Partitioned-Primary-Indexes
    accessed: '2026-10-15'
    confidence: high
  - text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
    url: https://docs.databricks.com/aws/en/delta/
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Choosing primary indexes so joined rows hash to the same AMP avoids redistributing rows across the BYNET.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: A Databricks SQL warehouse is a compute resource for running SQL queries.
    url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Teradata row level security controls access per row and per SQL operation by comparing user and row security labels.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Security-Administration/Implementing-Row-Level-Security/Row-Level-Security
    accessed: '2026-10-15'
    confidence: high
  - text: Unity Catalog provides centralized access control, auditing and lineage across Databricks workspaces.
    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Teradata balances work by spreading rows evenly across AMPs, each solely responsible for its own data.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: Databricks serverless compute is managed by Databricks and starts without customer-managed clusters.
    url: https://docs.databricks.com/aws/en/compute/serverless/
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Teradata resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Databricks, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Databricks instead of copying Teradata structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
