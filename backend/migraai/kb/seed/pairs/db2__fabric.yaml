source: db2
target: fabric
architecture_overview:
- text: A Db2 Warehouse MPP cluster scales out by adding data nodes with minimal interruption.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
  accessed: '2026-10-15'
  confidence: high
- text: A Microsoft Fabric warehouse stores data in Delta Parquet format in OneLake.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
  accessed: '2026-10-15'
  confidence: high
- text: Fabric Data Warehouse uses autonomous workload management with a distributed query engine and no tuning knobs.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Db2 CREATE TABLE has an ORGANIZE BY clause to choose column- or row-organized storage.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table
    accessed: '2026-10-15'
    confidence: high
  - text: A Microsoft Fabric warehouse stores data in Delta Parquet format in OneLake.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Db2 workload management uses DDL objects such as service classes, workloads, thresholds and work action sets.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=identification-workload-management-ddl-statements
    accessed: '2026-10-15'
    confidence: high
  - text: Fabric compute runs on capacity units with smoothing and throttling of usage.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/compute-capacity-smoothing-throttling
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Db2 Warehouse row and column access control (RCAC) filters rows and masks columns per user as fine-grained access control.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
    accessed: '2026-10-15'
    confidence: high
  - text: Fabric warehouse security combines workspace roles, item permissions and granular T-SQL permissions.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/security
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Db2 Warehouse MPP cluster needs at least three nodes (one head, two data) and an SMP deployment cannot be turned into MPP by adding nodes.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
    accessed: '2026-10-15'
    confidence: high
  - text: Fabric Data Warehouse uses autonomous workload management with a distributed query engine and no tuning knobs.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Db2 Warehouse resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Fabric, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Fabric instead of copying Db2 Warehouse structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
