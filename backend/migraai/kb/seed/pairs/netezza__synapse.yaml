source: netezza
target: synapse
architecture_overview:
- text: Netezza spreads processing across SPUs that each own memory and data slices in a shared-nothing design.
  url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
  accessed: '2026-10-15'
  confidence: high
- text: Azure Synapse dedicated SQL pool is an MPP engine where a control node distributes work to compute nodes over 60 distributions.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/massively-parallel-processing-mpp-architecture
  accessed: '2026-10-15'
  confidence: high
- text: Synapse dedicated SQL pool tables are hash-distributed, round-robin or replicated.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-distribute
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Netezza zone maps let the storage manager skip table extents that cannot contain rows matching a restricted scan.
    url: https://www.ibm.com/docs/en/netezza?topic=statistics-zone-maps
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool tables default to clustered columnstore indexes.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-tables-index
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Tables that are commonly joined should be distributed on the join column so Netezza can run a collocated join without moving data between SPUs.
    url: https://www.ibm.com/docs/en/netezza?topic=keys-distribution-collocated-joins
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool compute is scaled by changing data warehouse units (DWUs) and can be paused.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: In Netezza, privileges granted to a group are inherited by all its members and are additive.
    url: https://www.ibm.com/docs/en/netezza?topic=control-security-model
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool supports Microsoft Entra authentication, row-level security and dynamic data masking.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-manage-security
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Netezza tables are distributed with DISTRIBUTE ON (columns) for hash distribution or DISTRIBUTE ON RANDOM for random distribution.
    url: https://www.ibm.com/docs/en/netezza?topic=databases-distribution-keys
    accessed: '2026-10-15'
    confidence: high
  - text: Synapse dedicated SQL pool compute is scaled by changing data warehouse units (DWUs) and can be paused.
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Netezza resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Synapse, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Synapse instead of copying Netezza structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
