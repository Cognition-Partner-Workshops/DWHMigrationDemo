sql_dialect_differences:
- text: Snowflake stores and resolves unquoted identifiers in uppercase.
  url: https://docs.snowflake.com/en/sql-reference/identifiers-syntax
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake TIMESTAMP_LTZ stores UTC and operates in the session time zone, while TIMESTAMP_NTZ ignores time zones.
  url: https://docs.snowflake.com/en/sql-reference/data-types-datetime
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake FLATTEN explodes compound values into multiple rows.
  url: https://docs.snowflake.com/en/sql-reference/functions/flatten
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse ALTER TABLE ... UPDATE is a mutation, a heavy operation not designed for frequent use.
  url: https://clickhouse.com/docs/reference/statements/alter/update
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse provides a lightweight DELETE statement.
  url: https://clickhouse.com/docs/reference/statements/delete
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse Decimal precision ranges from 1 to 76, default 10.
  url: https://clickhouse.com/docs/reference/data-types/decimal
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse String values have arbitrary length and can contain any bytes.
  url: https://clickhouse.com/docs/reference/data-types/string
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse columns are non-nullable unless declared Nullable(T).
  url: https://clickhouse.com/docs/reference/data-types/nullable
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse supports QUALIFY.
  url: https://clickhouse.com/docs/reference/statements/select/qualify
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: Snowflake supports bulk unloading of table or query data to files.
  url: https://docs.snowflake.com/en/user-guide/data-unload-overview
  accessed: '2026-10-15'
  confidence: high
- text: COPY INTO <location> unloads table or query data to files and supports PARTITION BY.
  url: https://docs.snowflake.com/en/sql-reference/sql/copy-into-location
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse s3 table function reads and writes files in S3-compatible storage.
  url: https://clickhouse.com/docs/reference/functions/table-functions/s3
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse iceberg table function queries Apache Iceberg tables.
  url: https://clickhouse.com/docs/reference/functions/table-functions/iceberg
  accessed: '2026-10-15'
  confidence: high
- text: The ClickHouse Snowflake migration guide uses Snowflake COPY INTO to S3 and ClickHouse INSERT INTO SELECT.
  url: https://clickhouse.com/docs/get-started/migrate/snowflake/migration-guide
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse recommends Parquet as the intermediate format because it preserves type information.
  url: https://clickhouse.com/docs/get-started/migrate/snowflake/migration-guide
  accessed: '2026-10-15'
  confidence: high
etl_migration:
