source: snowflake
target: clickhouse
architecture_overview:
- text: Snowflake combines shared-disk and shared-nothing designs in a hybrid architecture.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: '2026-10-15'
  confidence: high
- text: ClickHouse Cloud SharedMergeTree is a cloud-native replacement for ReplicatedMergeTree.
  url: https://clickhouse.com/docs/products/cloud/features/infrastructure/shared-merge-tree
  accessed: '2026-10-15'
  confidence: high
- text: A MergeTree primary key sets the sort order within each table part.
  url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake compute is provided through warehouses sized in doubling steps.
  url: https://clickhouse.com/docs/get-started/migrate/snowflake/overview
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Snowflake automatically divides table data into 50-500 MB (uncompressed) micro-partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: '2026-10-15'
    confidence: high
  - text: MergeTree primary keys index 8192-row granules rather than individual rows.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Snowflake warehouses bill per second with a 60-second minimum each time they start.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse Cloud idles and resumes compute automatically.
    url: https://clickhouse.com/docs/products/cloud/reference/architecture
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Snowflake assigns privileges to roles, which are granted to users (RBAC), alongside object ownership (DAC).
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse uses RBAC-based access control.
    url: https://clickhouse.com/docs/concepts/features/security/access-rights
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Snowflake multi-cluster warehouses start extra clusters automatically, up to a configured maximum, for concurrency.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: '2026-10-15'
    confidence: high
  - text: ClickHouse primary indexes turn scans into fast binary searches with logarithmic runtime.
    url: https://clickhouse.com/docs/get-started/about/why-clickhouse-is-so-fast
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Inventory Snowflake objects with GET_DDL and ACCOUNT_USAGE, convert DDL and SQL with an automated translator, then move data by unloading to Parquet in object storage (or using a native connector/federation where available). Rebuild tasks, streams and pipes as ClickHouse orchestration and incremental-load constructs, re-create roles, masking and row policies, and validate with row counts and checksums before cutover.
