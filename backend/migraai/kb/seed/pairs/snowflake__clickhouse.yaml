risks:
  sql:
    level: high
    notes: Dialect rewrites (Snowflake specifics to ClickHouse)
  data:
    level: medium
    notes: Type and precision mapping, semi-structured data and timestamp semantics
  security:
    level: medium
    notes: Re-creating roles, grants and fine-grained policies in the ClickHouse model
  governance:
    level: high
    notes: Lineage, tags and catalog ownership must be rebuilt
  platform:
    level: medium
    notes: Feature gaps between Snowflake and ClickHouse need redesign
  operational:
    level: high
    notes: Re-platforming orchestration, monitoring and cost controls
