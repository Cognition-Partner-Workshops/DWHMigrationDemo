source: snowflake
target: databricks
architecture_overview:
- text: Snowflake combines shared-disk and shared-nothing designs in a hybrid architecture.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: '2026-10-15'
  confidence: high
- text: 'Databricks tables are Delta Lake: Parquet files plus a transaction log providing ACID transactions.'
  url: https://docs.databricks.com/aws/en/delta/
  accessed: '2026-10-15'
  confidence: high
- text: Unity Catalog uses a three-level catalog.schema.object namespace.
  url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/
  accessed: '2026-10-15'
  confidence: high
- text: Databricks Lakehouse Federation can run federated queries on Snowflake data.
  url: https://docs.databricks.com/aws/en/query-federation/snowflake
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Snowflake automatically divides table data into 50-500 MB (uncompressed) micro-partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: '2026-10-15'
    confidence: high
  - text: Databricks liquid clustering replaces partitioning and ZORDER and can change keys without rewriting data.
    url: https://docs.databricks.com/aws/en/tables/clustering
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Snowflake warehouses bill per second with a 60-second minimum each time they start.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: '2026-10-15'
    confidence: high
  - text: Databricks SQL warehouses are serverless, pro or classic.
    url: https://docs.databricks.com/aws/en/compute/sql-warehouse/warehouse-types
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Snowflake assigns privileges to roles, which are granted to users (RBAC), alongside object ownership (DAC).
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: '2026-10-15'
    confidence: high
  - text: Unity Catalog row filters and column masks restrict visible rows and values at query time.
    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks/
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Snowflake multi-cluster warehouses start extra clusters automatically, up to a configured maximum, for concurrency.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: '2026-10-15'
    confidence: high
  - text: Predictive optimization runs OPTIMIZE, VACUUM and ANALYZE automatically on Unity Catalog managed tables.
    url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Inventory Snowflake objects with GET_DDL and ACCOUNT_USAGE, convert DDL and SQL with an automated translator, then move data by unloading to Parquet in object storage (or using a native connector/federation where available). Rebuild tasks, streams and pipes as Databricks orchestration and incremental-load constructs, re-create roles, masking and row policies, and validate with row counts and checksums before cutover.
object_mapping:
- source_object: TABLE (permanent/transient)
  target_object: Unity Catalog managed Delta table
  notes: ''
  claim:
    text: Unity Catalog managed tables are the default, recommended table type.
    url: https://docs.databricks.com/aws/en/tables/managed
    accessed: '2026-10-15'
    confidence: high
- source_object: VIEW / SECURE VIEW
  target_object: View
  notes: ''
  claim:
    text: A Databricks view stores only its query text in the metastore.
    url: https://docs.databricks.com/aws/en/views/
    accessed: '2026-10-15'
    confidence: high
- source_object: MATERIALIZED VIEW
  target_object: Materialized view
  notes: ''
  claim:
    text: Databricks materialized views cache results and refresh on a schedule or automatically.
    url: https://docs.databricks.com/aws/en/ldp/dbsql/materialized
    accessed: '2026-10-15'
    confidence: high
- source_object: STORED PROCEDURE (Snowflake Scripting/JavaScript/Python)
  target_object: SQL procedure / SQL script
  notes: ''
  claim:
    text: CREATE PROCEDURE is available on Databricks Runtime 17.0+ with Unity Catalog.
    url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-procedure
    accessed: '2026-10-15'
    applies_to: Databricks Runtime 17.0+
    confidence: high
- source_object: TASK / task graph
  target_object: Lakeflow Job
  notes: ''
  claim:
    text: Lakeflow Jobs schedule and orchestrate tasks.
    url: https://docs.databricks.com/aws/en/jobs/
    accessed: '2026-10-15'
    confidence: high
- source_object: STREAM
  target_object: Delta change data feed
  notes: ''
  claim:
    text: Change data feed records row-level changes with metadata.
    url: https://docs.databricks.com/aws/en/tables/features/change-data-feed
    accessed: '2026-10-15'
    confidence: high
- source_object: PIPE (Snowpipe) / COPY INTO
  target_object: Auto Loader / COPY INTO
  notes: ''
  claim:
    text: Auto Loader processes new files incrementally.
    url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/
    accessed: '2026-10-15'
    confidence: high
- source_object: EXTERNAL TABLE / STAGE
  target_object: Unity Catalog external table
  notes: ''
  claim:
    text: A Unity Catalog external table needs a registered external location; dropping it keeps the data.
    url: https://docs.databricks.com/aws/en/tables/external
    accessed: '2026-10-15'
    confidence: high
- source_object: VARIANT column
  target_object: VARIANT column
  notes: ''
  claim:
    text: VARIANT stores semi-structured data.
    url: https://docs.databricks.com/aws/en/tables/features/variant
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Snowflake stores and resolves unquoted identifiers in uppercase.
  url: https://docs.snowflake.com/en/sql-reference/identifiers-syntax
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake TIMESTAMP_LTZ stores UTC and operates in the session time zone, while TIMESTAMP_NTZ ignores time zones.
  url: https://docs.snowflake.com/en/sql-reference/data-types-datetime
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake FLATTEN explodes compound values into multiple rows.
  url: https://docs.snowflake.com/en/sql-reference/functions/flatten
  accessed: '2026-10-15'
  confidence: high
- text: Databricks identifiers are case-insensitive; delimited identifiers use backticks.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-identifiers
  accessed: '2026-10-15'
  confidence: high
- text: ANSI mode is enabled by default from Databricks Runtime 17.0.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-ansi-compliance
  accessed: '2026-10-15'
  applies_to: Databricks Runtime 17.0+
  confidence: high
- text: Databricks SQL scripts are BEGIN ... END compound statements.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-scripting
  accessed: '2026-10-15'
  confidence: high
- text: Databricks provides iff(), matching Snowflake IFF.
  url: https://docs.databricks.com/aws/en/sql/language-manual/functions/iff
  accessed: '2026-10-15'
  confidence: high
- text: Databricks zeroifnull (Runtime 16.0+) matches Snowflake ZEROIFNULL.
  url: https://docs.databricks.com/aws/en/sql/language-manual/functions/zeroifnull
  accessed: '2026-10-15'
  applies_to: Databricks Runtime 16.0+
  confidence: high
- text: Databricks parse_json returns VARIANT, like Snowflake PARSE_JSON (Runtime 15.3+).
  url: https://docs.databricks.com/aws/en/sql/language-manual/functions/parse_json
  accessed: '2026-10-15'
  applies_to: Databricks Runtime 15.3+
  confidence: high
data_movement:
- text: Snowflake supports bulk unloading of table or query data to files.
  url: https://docs.snowflake.com/en/user-guide/data-unload-overview
  accessed: '2026-10-15'
  confidence: high
- text: COPY INTO <location> unloads table or query data to files and supports PARTITION BY.
  url: https://docs.snowflake.com/en/sql-reference/sql/copy-into-location
  accessed: '2026-10-15'
  confidence: high
- text: Auto Loader incrementally processes new files as they land in cloud storage.
  url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/
  accessed: '2026-10-15'
  confidence: high
- text: Databricks COPY INTO is idempotent and skips already-loaded files.
  url: https://docs.databricks.com/aws/en/sql/language-manual/delta-copy-into
  accessed: '2026-10-15'
  confidence: high
- text: Lakehouse Federation to Snowflake needs connection objects in the Unity Catalog metastore.
  url: https://docs.databricks.com/aws/en/query-federation/snowflake
  accessed: '2026-10-15'
  confidence: high
