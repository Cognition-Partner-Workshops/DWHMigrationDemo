risks:
  sql:
    level: high
    notes: PL/SQL translation is substantial; SnowConvert covers much but manual rework remains.
  data:
    level: medium
    notes: DATE/timestamp and ''=NULL semantics need care.
  security:
    level: medium
    notes: VPD → row access policies; TDE → managed encryption.
  governance:
    level: low
    notes: Role hierarchy must be redesigned.
  platform:
    level: medium
    notes: Instance/RAC concepts replaced by credit-based warehouses.
  operational:
    level: low
    notes: Simpler ops; auto-suspend replaces manual resource management.
