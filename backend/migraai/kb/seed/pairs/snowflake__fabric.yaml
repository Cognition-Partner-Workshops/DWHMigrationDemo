risks:
  sql:
    level: medium
    notes: Dialect rewrites (Snowflake specifics to Microsoft Fabric Data Warehouse)
  data:
    level: medium
    notes: Type and precision mapping, semi-structured data and timestamp semantics
  security:
    level: medium
    notes: Re-creating roles, grants and fine-grained policies in the Microsoft Fabric Data Warehouse model
  governance:
    level: medium
    notes: Lineage, tags and catalog ownership must be rebuilt
  platform:
    level: medium
    notes: Feature gaps between Snowflake and Microsoft Fabric Data Warehouse need redesign
  operational:
    level: medium
    notes: Re-platforming orchestration, monitoring and cost controls
