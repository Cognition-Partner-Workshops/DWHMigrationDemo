source: snowflake
target: fabric
architecture_overview:
- text: Snowflake combines shared-disk and shared-nothing designs in a hybrid architecture.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: '2026-10-15'
  confidence: high
- text: Fabric Data Warehouse stores data as Delta tables (Parquet plus a transaction log).
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
  accessed: '2026-10-15'
  confidence: high
- text: Fabric Data Warehouse is developed primarily with T-SQL.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
  accessed: '2026-10-15'
  confidence: high
- text: Fabric mirroring can continuously replicate Snowflake data into OneLake.
  url: https://learn.microsoft.com/en-us/fabric/mirroring/snowflake
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Snowflake automatically divides table data into 50-500 MB (uncompressed) micro-partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: '2026-10-15'
    confidence: high
  - text: OneLake shortcuts reflect source schema changes without manual updates.
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Snowflake warehouses bill per second with a 60-second minimum each time they start.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: '2026-10-15'
    confidence: high
  - text: Fabric Data Warehouse applies smoothing and throttling to capacity consumption.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/compute-capacity-smoothing-throttling
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Snowflake assigns privileges to roles, which are granted to users (RBAC), alongside object ownership (DAC).
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: '2026-10-15'
    confidence: high
  - text: Fabric workspace roles grant permissions for all warehouses in a workspace.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/security
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Snowflake multi-cluster warehouses start extra clusters automatically, up to a configured maximum, for concurrency.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: '2026-10-15'
    confidence: high
  - text: The Fabric query optimizer relies on persisted column statistics.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Inventory Snowflake objects with GET_DDL and ACCOUNT_USAGE, convert DDL and SQL with an automated translator, then move data by unloading to Parquet in object storage (or using a native connector/federation where available). Rebuild tasks, streams and pipes as Microsoft Fabric Data Warehouse orchestration and incremental-load constructs, re-create roles, masking and row policies, and validate with row counts and checksums before cutover.
object_mapping:
- source_object: TABLE (permanent/transient)
  target_object: Warehouse table (Delta)
  notes: ''
  claim:
    text: Fabric Warehouse tables are stored as Delta tables.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
    accessed: '2026-10-15'
    confidence: high
- source_object: VIEW / SECURE VIEW
  target_object: T-SQL view
  notes: ''
  claim:
    text: Fabric supports T-SQL views.
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
    accessed: '2026-10-15'
    confidence: high
- source_object: MATERIALIZED VIEW
  target_object: Table refreshed by pipeline (no materialized view)
  notes: ''
  claim:
    text: Dataflow Gen2 can transform data before loading tables.
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-factory-overview
    accessed: '2026-10-15'
    confidence: medium
- source_object: STORED PROCEDURE (Snowflake Scripting/JavaScript/Python)
