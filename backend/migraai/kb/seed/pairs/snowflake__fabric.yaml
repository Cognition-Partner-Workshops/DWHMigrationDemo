sql_dialect_differences:
- text: Snowflake stores and resolves unquoted identifiers in uppercase.
  url: https://docs.snowflake.com/en/sql-reference/identifiers-syntax
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake TIMESTAMP_LTZ stores UTC and operates in the session time zone, while TIMESTAMP_NTZ ignores time zones.
  url: https://docs.snowflake.com/en/sql-reference/data-types-datetime
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake FLATTEN explodes compound values into multiple rows.
  url: https://docs.snowflake.com/en/sql-reference/functions/flatten
  accessed: '2026-10-15'
  confidence: high
- text: Fabric varchar(max) storage is currently limited to 16 MB.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
  accessed: '2026-10-15'
  confidence: high
- text: Fabric datetime2 and time support at most 6 fractional-second digits.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
  accessed: '2026-10-15'
  confidence: high
- text: Fabric lacks nchar/nvarchar; char and varchar are used instead.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
  accessed: '2026-10-15'
  confidence: high
- text: Fabric PRIMARY KEY requires NONCLUSTERED and NOT ENFORCED.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
  accessed: '2026-10-15'
  confidence: high
- text: Fabric Data Warehouse supports MERGE as a generally available feature.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: Snowflake supports bulk unloading of table or query data to files.
  url: https://docs.snowflake.com/en/user-guide/data-unload-overview
  accessed: '2026-10-15'
  confidence: high
- text: COPY INTO <location> unloads table or query data to files and supports PARTITION BY.
  url: https://docs.snowflake.com/en/sql-reference/sql/copy-into-location
  accessed: '2026-10-15'
  confidence: high
- text: COPY INTO is the recommended T-SQL ingestion statement for new code in Fabric Warehouse.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data-copy
  accessed: '2026-10-15'
  confidence: high
- text: Fabric Warehouse bulk loads via T-SQL/TDS or via Spark writing Delta tables.
  url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing
  accessed: '2026-10-15'
  confidence: high
- text: Mirrored Snowflake table data is converted to Parquet in OneLake.
  url: https://learn.microsoft.com/en-us/fabric/mirroring/snowflake
  accessed: '2026-10-15'
  confidence: high
- text: The Azure Data Factory/Synapse Snowflake connector supports Copy activity source and sink.
  url: https://learn.microsoft.com/en-us/azure/data-factory/connector-snowflake
  accessed: '2026-10-15'
  confidence: high
