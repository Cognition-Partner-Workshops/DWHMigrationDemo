sql_dialect_differences:
- text: Db2 Warehouse accepts the Oracle (+) outer join operator in WHERE predicates.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 Warehouse supports Oracle-style hierarchical (recursive) queries.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 DECODE compares an expression with search values and returns the matching result.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=functions-decode
  accessed: '2026-10-15'
  confidence: high
- text: Databricks SQL supports the QUALIFY clause to filter window function results.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-qualify
  accessed: '2026-10-15'
  confidence: high
- text: Databricks SQL supports SQL scripting with compound statements and control flow.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-scripting
  accessed: '2026-10-15'
  confidence: high
- text: Databricks SQL supports complex types ARRAY, MAP and STRUCT.
  url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-datatypes
  accessed: '2026-10-15'
  confidence: high
data_movement:
- text: A Db2 Warehouse external table maps a delimited or fixed-length file outside the database and can be used to query or unload data.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table-external
  accessed: '2026-10-15'
  confidence: high
- text: Databricks COPY INTO loads files from cloud object storage into a Delta table and skips files already loaded.
  url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/copy-into/
  accessed: '2026-10-15'
  confidence: high
- text: Databricks Lakehouse Federation queries external databases in place without moving the data.
  url: https://docs.databricks.com/aws/en/query-federation/
  accessed: '2026-10-15'
  confidence: high
etl_migration:
- text: The Db2 Warehouse dbload command loads data files in local mode or in remote mode over the network.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=command-loading-data-files-dbload
  accessed: '2026-10-15'
  confidence: high
- text: Databricks offers managed connectors, Auto Loader and COPY INTO for data ingestion.
  url: https://docs.databricks.com/aws/en/ingestion/
  accessed: '2026-10-15'
  confidence: high
- text: Databricks provides guidance for migrating enterprise data warehouses to the lakehouse.
  url: https://docs.databricks.com/aws/en/migration/warehouse-to-lakehouse
  accessed: '2026-10-15'
  confidence: high
security_migration:
- text: Db2 GRANT ROLE grants roles to users, groups or other roles, optionally WITH ADMIN OPTION.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-grant-role
  accessed: '2026-10-15'
  confidence: high
- text: Only users with SECADM authority can manage Db2 row and column access controls.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
  accessed: '2026-10-15'
  confidence: high
- text: Unity Catalog provides centralized access control, auditing and lineage across Databricks workspaces.
  url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/
  accessed: '2026-10-15'
  confidence: high
- text: Databricks Unity Catalog supports row filters and column masks on tables.
  url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks/
  accessed: '2026-10-15'
  confidence: high
