  confidence: high
- text: Databricks predictive optimization runs maintenance such as OPTIMIZE and VACUUM automatically on Unity Catalog managed tables.
  url: https://docs.databricks.com/aws/en/optimizations/predictive-optimization
  accessed: '2026-10-15'
  confidence: high
