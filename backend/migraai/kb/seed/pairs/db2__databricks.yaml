source: db2
target: databricks
architecture_overview:
- text: A Db2 Warehouse MPP cluster scales out by adding data nodes with minimal interruption.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
  accessed: '2026-10-15'
  confidence: high
- text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
  url: https://docs.databricks.com/aws/en/delta/
  accessed: '2026-10-15'
  confidence: high
- text: A Databricks SQL warehouse is a compute resource for running SQL queries.
  url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Db2 CREATE TABLE has an ORGANIZE BY clause to choose column- or row-organized storage.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table
    accessed: '2026-10-15'
    confidence: high
  - text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
    url: https://docs.databricks.com/aws/en/delta/
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Db2 workload management uses DDL objects such as service classes, workloads, thresholds and work action sets.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=identification-workload-management-ddl-statements
    accessed: '2026-10-15'
    confidence: high
  - text: A Databricks SQL warehouse is a compute resource for running SQL queries.
    url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Db2 Warehouse row and column access control (RCAC) filters rows and masks columns per user as fine-grained access control.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
    accessed: '2026-10-15'
    confidence: high
  - text: Unity Catalog provides centralized access control, auditing and lineage across Databricks workspaces.
    url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Db2 Warehouse MPP cluster needs at least three nodes (one head, two data) and an SMP deployment cannot be turned into MPP by adding nodes.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
    accessed: '2026-10-15'
    confidence: high
  - text: Databricks serverless compute is managed by Databricks and starts without customer-managed clusters.
    url: https://docs.databricks.com/aws/en/compute/serverless/
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Db2 Warehouse resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into Databricks, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for Databricks instead of copying Db2 Warehouse structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
object_mapping:
- source_object: Table (DISTRIBUTE BY / ORGANIZE BY)
  target_object: Delta table (Unity Catalog)
  notes: ''
  claim:
    text: Delta Lake is the default table format on Databricks and adds ACID transactions to Parquet files.
    url: https://docs.databricks.com/aws/en/delta/
    accessed: '2026-10-15'
    confidence: high
- source_object: SQL procedure (SQL PL)
  target_object: SQL stored procedure
  notes: ''
  claim:
    text: Databricks supports CREATE PROCEDURE for SQL stored procedures in Unity Catalog.
    url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-procedure
    accessed: '2026-10-15'
    confidence: high
- source_object: RCAC row permission
  target_object: Row filter / column mask
  notes: ''
