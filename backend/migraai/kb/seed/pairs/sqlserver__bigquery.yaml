architecture_overview:
- text: A page is a fundamental unit of data storage in the SQL Server Database Engine.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/pages-and-extents-architecture-guide?view=sql-server-ver17
  accessed: &id001 2026-10-15
  confidence: high
- text: A columnstore index stores, retrieves and manages data in a columnar format.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: BigQuery is a fully managed, AI-ready data platform with a serverless architecture.
  url: https://docs.cloud.google.com/bigquery/docs/introduction
  accessed: *id001
  confidence: high
- text: BigQuery separates storage and compute, scaling each independently, and executes queries completely in memory across parallel workers.
  url: https://docs.cloud.google.com/bigquery/docs/storage_overview
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: A clustered index sorts and stores table rows by its key values, and a table can have only one clustered index.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/clustered-and-nonclustered-indexes-described?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: A partitioned table in BigQuery is divided into segments called partitions, enabling partition pruning on the partitioning column.
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
    accessed: *id001
    confidence: high
  - text: A clustered table in BigQuery sorts storage blocks by user-defined clustered columns to reduce scanned bytes.
    url: https://docs.cloud.google.com/bigquery/docs/clustered-tables
    accessed: *id001
    confidence: high
  compute:
  - text: Resource governor manages Database Engine resource consumption and enforces policies for user workloads.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute SQL queries.
    url: https://docs.cloud.google.com/bigquery/docs/slots
    accessed: *id001
    confidence: high
  security:
  - text: Row-level security uses group membership or execution context to control access to table rows.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: BigQuery access control uses Identity and Access Management (IAM) predefined roles and permissions.
    url: https://docs.cloud.google.com/bigquery/docs/access-control
    accessed: *id001
    confidence: high
  - text: BigQuery row-level security uses row access policies to filter rows visible to a user.
    url: https://docs.cloud.google.com/bigquery/docs/row-level-security-intro
    accessed: *id001
    confidence: high
  scalability:
  - text: Partitioned table and index data is divided into units that can be spread across multiple filegroups or kept in one.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: BigQuery separates storage and compute, scaling each independently, and executes queries completely in memory across parallel workers.
    url: https://docs.cloud.google.com/bigquery/docs/storage_overview
    accessed: *id001
    confidence: high
recommended_strategy: Translate T-SQL to GoogleSQL with the BigQuery batch SQL translator (part of the BigQuery Migration Service), transfer data via the Data Transfer Service or file-based batch loads, and redesign for partition+cluster pruning and slot-based capacity. Map SQL Server security to BigQuery IAM plus row access policies and column-level policy tags.
object_mapping:
- source_object: Stored procedure (T-SQL)
  target_object: SQL stored procedure (GoogleSQL)
  notes: Procedural language statements supported.
  claim:
    text: A BigQuery stored procedure is a collection of statements that supports procedural language statements.
    url: https://docs.cloud.google.com/bigquery/docs/procedures
    accessed: *id001
    confidence: high
- source_object: User-defined function
  target_object: UDF (SQL or JavaScript)
  notes: Rewrite T-SQL UDFs.
  claim:
    text: The GoogleSQL procedural language executes multiple statements in one query as a multi-statement query.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language
    accessed: *id001
    confidence: high
- source_object: Indexed view
  target_object: Materialized view
  notes: BigQuery materialized views auto-merge fresh data.
  claim:
    text: BigQuery materialized views are precomputed tables that optimize query performance and reduce execution costs.
    url: https://docs.cloud.google.com/bigquery/docs/materialized-views-intro
    accessed: *id001
    confidence: high
- source_object: Trigger
  target_object: None — redesign
  notes: No DML triggers; move logic to scheduled queries/pipelines.
  claim:
    text: The GoogleSQL procedural language executes multiple statements in one query as a multi-statement query.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language
    accessed: *id001
    confidence: high
- source_object: Table (clustered index)
  target_object: Partitioned/clustered table
  notes: Physical design maps to partition + cluster keys.
  claim:
    text: A clustered table in BigQuery sorts storage blocks by user-defined clustered columns to reduce scanned bytes.
    url: https://docs.cloud.google.com/bigquery/docs/clustered-tables
    accessed: *id001
    confidence: high
