risks:
  sql:
    level: high
    notes: T-SQL to GoogleSQL is a full dialect conversion; translator covers a subset and manual rework remains.
  data:
    level: medium
    notes: No enforced constraints and different datetime semantics; validate post-load.
  security:
    level: medium
    notes: Security model moves to IAM + policy tags/row access policies.
  governance:
    level: low
    notes: Dataplex/catalog integration needs planning.
  platform:
    level: high
    notes: Serverless slot model and table design (partition/cluster) differ fundamentally from instance tuning.
  operational:
    level: low
    notes: No infrastructure ops; monitor slot usage.
