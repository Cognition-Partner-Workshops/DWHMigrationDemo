recommended_strategy: 'ClickHouse is a distributed columnar OLAP engine with no procedural SQL layer: extract Oracle tables (Data Pump/GoldenGate export or JDBC bridge reads), recreate them as MergeTree tables with ORDER BY keys and shard via Distributed tables, and rewrite PL/SQL logic as queries, materialized views and externally scheduled jobs. Plan for insert-optimized workloads — row updates/deletes are heavyweight mutations.'
object_mapping:
- source_object: Heap-organized table
  target_object: MergeTree table
  notes: ORDER BY key defines physical layout.
  claim:
    text: MergeTree-family table engines are the most commonly used engines in ClickHouse, designed for high ingest rates and huge data volumes.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: *id001
    confidence: high
- source_object: Partitioned table
  target_object: MergeTree PARTITION BY
  notes: Partitioning exists in MergeTree.
  claim:
    text: MergeTree-family table engines are the most commonly used engines in ClickHouse, designed for high ingest rates and huge data volumes.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: *id001
    confidence: high
- source_object: Materialized view
  target_object: Materialized view (insert-time)
  notes: MVs compute on insert.
  claim:
    text: A ClickHouse materialized view is a trigger that runs a query on blocks of inserted data, shifting cost from query time to insert time.
    url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
    accessed: *id001
    confidence: high
- source_object: Package (PL/SQL)
  target_object: None — external jobs/queries
  notes: No procedural layer.
  claim:
    text: A ClickHouse materialized view is a trigger that runs a query on blocks of inserted data, shifting cost from query time to insert time.
    url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
    accessed: *id001
    confidence: high
- source_object: Sequence
  target_object: Insert-time generated key
  notes: Generate keys in ingest.
  claim:
    text: MergeTree-family table engines are the most commonly used engines in ClickHouse, designed for high ingest rates and huge data volumes.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: *id001
    confidence: high
- source_object: MERGE statement
  target_object: Mutations / ReplacingMergeTree
  notes: Upserts via mutations or replacing engine.
  claim:
    text: ReplacingMergeTree deduplicates rows with the same sorting key during merges.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/replacingmergetree
    accessed: *id001
    confidence: high
sql_dialect_differences:
- text: Oracle treats a zero-length character value as NULL, unlike most target platforms.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Nulls.html
  accessed: *id001
  confidence: high
- text: Oracle hierarchical queries use START WITH for root rows and CONNECT BY for the parent-child relationship.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Hierarchical-Queries.html
  accessed: *id001
  confidence: high
- text: The Oracle DATE data type holds both date and time information.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Data-Types.html
  accessed: *id001
  confidence: high
- text: NVL returns the second argument when the first is null — Oracle's equivalent of COALESCE with two args.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/NVL.html
  accessed: *id001
  confidence: high
- text: DECODE compares an expression to search values one by one — a non-ANSI conditional.
  url: https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/DECODE.html
  accessed: *id001
  confidence: high
- text: ClickHouse lightweight DELETE is contrasted with the heavyweight ALTER TABLE DELETE mutation.
  url: https://clickhouse.com/docs/reference/statements/delete
  accessed: *id001
  confidence: high
- text: ClickHouse transactions across multiple statements are experimental; inserts have their own durability guarantees.
  url: https://clickhouse.com/docs/concepts/features/operations/insert/transactions
  accessed: *id001
  confidence: high
- text: ClickHouse offers fixed-width integer types from Int8 through Int256.
  url: https://clickhouse.com/docs/reference/data-types/int-uint
  accessed: *id001
  confidence: high
