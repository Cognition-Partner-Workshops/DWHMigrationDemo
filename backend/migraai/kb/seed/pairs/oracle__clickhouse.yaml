risks:
  sql:
    level: high
    notes: No PL/SQL layer; major code relocation to app/pipeline.
  data:
    level: medium
    notes: Update-heavy OLTP patterns fit poorly.
  security:
    level: medium
    notes: VPD/grants map to row policies and RBAC.
  governance:
    level: medium
    notes: Self-managed governance replaces Oracle's model.
  platform:
    level: high
    notes: Full paradigm and operations change.
  operational:
    level: medium
    notes: Cluster ops and mutations need new runbooks.
