architecture_overview:
- text: A page is a fundamental unit of data storage in the SQL Server Database Engine.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/pages-and-extents-architecture-guide?view=sql-server-ver17
  accessed: &id001 2026-10-15
  confidence: high
- text: A columnstore index stores, retrieves and manages data in a columnar format.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: ClickHouse is a high-performance, column-oriented SQL DBMS for online analytical processing (OLAP).
  url: https://clickhouse.com/docs/get-started/about/intro
  accessed: *id001
  confidence: high
- text: MergeTree-family table engines are the most commonly used engines in ClickHouse, designed for high ingest rates and huge data volumes.
  url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: A clustered index sorts and stores table rows by its key values, and a table can have only one clustered index.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/clustered-and-nonclustered-indexes-described?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: MergeTree-family table engines are the most commonly used engines in ClickHouse, designed for high ingest rates and huge data volumes.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: *id001
    confidence: high
  - text: The MergeTree primary key does not reference individual rows but blocks of 8192 rows called granules, keeping the index in memory.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: *id001
    confidence: high
  compute:
  - text: Resource governor manages Database Engine resource consumption and enforces policies for user workloads.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: A Distributed engine table stores no data itself but enables distributed query processing across servers.
    url: https://clickhouse.com/docs/reference/engines/table-engines/special/distributed
    accessed: *id001
    confidence: high
  security:
  - text: Row-level security uses group membership or execution context to control access to table rows.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: ClickHouse supports access control based on RBAC with user accounts, roles, row policies, settings profiles and quotas.
    url: https://clickhouse.com/docs/concepts/features/security/access-rights
    accessed: *id001
    confidence: high
  - text: A ClickHouse row policy is a filter used to determine which rows a user can read from a table.
    url: https://clickhouse.com/docs/reference/statements/create/row-policy
    accessed: *id001
    confidence: high
  scalability:
  - text: Partitioned table and index data is divided into units that can be spread across multiple filegroups or kept in one.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: A Distributed engine table stores no data itself but enables distributed query processing across servers.
    url: https://clickhouse.com/docs/reference/engines/table-engines/special/distributed
    accessed: *id001
    confidence: high
recommended_strategy: 'ClickHouse is an OLAP columnar engine with a different data model: denormalize where possible, map tables to MergeTree-family engines with ORDER BY keys (not enforced PKs), and plan that UPDATE/DELETE are heavyweight mutations. Move data via JDBC/ODBC table functions, ClickHouse clients on staged files, or a CDC tool; rewrite T-SQL logic as views, materialized views and dictionaries.'
object_mapping:
- source_object: Table with clustered index
  target_object: MergeTree table (ORDER BY key)
  notes: Sparse primary index over granules, not row-level PK.
  claim:
    text: MergeTree-family table engines are the most commonly used engines in ClickHouse, designed for high ingest rates and huge data volumes.
    url: https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/mergetree
    accessed: *id001
    confidence: high
- source_object: Stored procedure (T-SQL)
  target_object: None — rewrite as queries/materialized views
  notes: ClickHouse has no stored procedures; shift logic to materialized views, scheduled queries or the app layer.
  claim:
    text: A ClickHouse materialized view is a trigger that runs a query on blocks of inserted data, shifting cost from query time to insert time.
    url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
    accessed: *id001
    confidence: high
- source_object: Indexed view
  target_object: Materialized view (insert-time trigger)
  notes: CH MVs compute on insert, not on query.
  claim:
    text: A ClickHouse materialized view is a trigger that runs a query on blocks of inserted data, shifting cost from query time to insert time.
    url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
    accessed: *id001
    confidence: high
- source_object: Trigger
  target_object: Materialized view
  notes: MVs act as insert-time triggers.
  claim:
    text: A ClickHouse materialized view is a trigger that runs a query on blocks of inserted data, shifting cost from query time to insert time.
    url: https://clickhouse.com/docs/concepts/features/materialized-views/incremental-materialized-view
    accessed: *id001
    confidence: high
- source_object: B-tree secondary index
  target_object: Data skipping index
  notes: Indexes serve skipping, not point lookups.
  claim:
    text: ClickHouse builds and uses a table's sparse primary index for fast filtering over granules.
    url: https://clickhouse.com/docs/guides/clickhouse/data-modelling/sparse-primary-indexes
    accessed: *id001
    confidence: high
