risks:
  sql:
    level: high
    notes: T-SQL procedural code has no home in ClickHouse; queries need rewriting to its dialect.
  data:
    level: medium
    notes: Update/delete semantics (mutations) differ; validate row counts after dedup engines.
  security:
    level: medium
    notes: RBAC and row policies exist but are configured via SQL-driven workflow or XML config.
  governance:
    level: low
    notes: No built-in catalog; rely on external governance.
  platform:
    level: high
    notes: MPP+columnar OLAP with sparse indexing is a different tuning discipline.
  operational:
    level: medium
    notes: Mutation management and part merges need operational attention.
