    text: The Storage Write API ingests via gRPC.
    url: https://docs.cloud.google.com/bigquery/docs/write-api-grpc
    accessed: '2026-10-15'
    confidence: high
- source_object: PIPE (Snowpipe) / COPY INTO
  target_object: Load job / Data Transfer Service
  notes: ''
  claim:
    text: BigQuery batch loading supports Parquet and ORC.
    url: https://docs.cloud.google.com/bigquery/docs/batch-loading-data
    accessed: '2026-10-15'
    confidence: high
- source_object: EXTERNAL TABLE / STAGE
  target_object: BigLake / external table
  notes: ''
  claim:
    text: BigLake tables query external data with access delegation.
    url: https://docs.cloud.google.com/bigquery/docs/biglake-intro
    accessed: '2026-10-15'
    confidence: high
- source_object: VARIANT column
  target_object: JSON or STRUCT/ARRAY column
  notes: ''
  claim:
    text: BigQuery has a native JSON type.
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/data-types
    accessed: '2026-10-15'
    confidence: high
sql_dialect_differences:
- text: Snowflake stores and resolves unquoted identifiers in uppercase.
  url: https://docs.snowflake.com/en/sql-reference/identifiers-syntax
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake TIMESTAMP_LTZ stores UTC and operates in the session time zone, while TIMESTAMP_NTZ ignores time zones.
  url: https://docs.snowflake.com/en/sql-reference/data-types-datetime
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake FLATTEN explodes compound values into multiple rows.
  url: https://docs.snowflake.com/en/sql-reference/functions/flatten
  accessed: '2026-10-15'
  confidence: high
- text: GoogleSQL quoted identifiers use backticks.
  url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/lexical
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery does not allow arrays of arrays.
  url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/data-types
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery integer aliases (INT, BIGINT, TINYINT, ...) all map to INT64.
  url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/data-types
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery primary keys are declared NOT ENFORCED.
  url: https://docs.cloud.google.com/bigquery/docs/primary-foreign-keys
  accessed: '2026-10-15'
  confidence: high
- text: GoogleSQL procedural scripts declare variables with DECLARE.
  url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake TIMESTAMP defaults to TIMESTAMP_NTZ, which maps to BigQuery DATETIME.
  url: https://docs.cloud.google.com/bigquery/docs/migration/snowflake-sql
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery migration converts untyped Snowflake arrays (ARRAY<VARIANT>) to ARRAY<JSON>.
  url: https://docs.cloud.google.com/bigquery/docs/migration/snowflake-sql
  accessed: '2026-10-15'
  confidence: high
- text: Snowflake NUMBER supports 38 digits of precision and 37 of scale.
  url: https://docs.cloud.google.com/bigquery/docs/migration/snowflake-sql
  accessed: '2026-10-15'
  confidence: high
data_movement:
