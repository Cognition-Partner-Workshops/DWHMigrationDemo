source: snowflake
target: bigquery
architecture_overview:
- text: Snowflake combines shared-disk and shared-nothing designs in a hybrid architecture.
  url: https://docs.snowflake.com/en/user-guide/intro-key-concepts
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery is a fully managed serverless data warehouse.
  url: https://docs.cloud.google.com/bigquery/docs/introduction
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery separates compute and storage layers.
  url: https://docs.cloud.google.com/bigquery/docs/introduction
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Snowflake automatically divides table data into 50-500 MB (uncompressed) micro-partitions.
    url: https://docs.snowflake.com/en/user-guide/tables-clustering-micropartitions
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery stores table data in columnar format.
    url: https://docs.cloud.google.com/bigquery/docs/storage_overview
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Snowflake warehouses bill per second with a 60-second minimum each time they start.
    url: https://docs.snowflake.com/en/user-guide/warehouses-overview
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery executes queries on slots, virtual compute units.
    url: https://docs.cloud.google.com/bigquery/docs/slots
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Snowflake assigns privileges to roles, which are granted to users (RBAC), alongside object ownership (DAC).
    url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery access control is based on IAM roles and permissions.
    url: https://docs.cloud.google.com/bigquery/docs/access-control
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Snowflake multi-cluster warehouses start extra clusters automatically, up to a configured maximum, for concurrency.
    url: https://docs.snowflake.com/en/user-guide/warehouses-multicluster
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery offers on-demand (bytes processed) and capacity-based billing.
    url: https://docs.cloud.google.com/bigquery/docs/reservations-intro
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Inventory Snowflake objects with GET_DDL and ACCOUNT_USAGE, convert DDL and SQL with an automated translator, then move data by unloading to Parquet in object storage (or using a native connector/federation where available). Rebuild tasks, streams and pipes as BigQuery orchestration and incremental-load constructs, re-create roles, masking and row policies, and validate with row counts and checksums before cutover.
object_mapping:
- source_object: TABLE (permanent/transient)
  target_object: Partitioned and clustered table
  notes: ''
  claim:
    text: BigQuery tables can be partitioned by ingestion time or integer range among others.
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
    accessed: '2026-10-15'
    confidence: high
- source_object: VIEW / SECURE VIEW
  target_object: Logical / authorized view
  notes: ''
  claim:
    text: BigQuery authorized views restrict what columns analysts see.
    url: https://docs.cloud.google.com/bigquery/docs/authorized-views
    accessed: '2026-10-15'
    confidence: high
- source_object: MATERIALIZED VIEW
  target_object: Materialized view
  notes: ''
  claim:
    text: BigQuery precomputes materialized views in the background.
    url: https://docs.cloud.google.com/bigquery/docs/materialized-views-intro
    accessed: '2026-10-15'
    confidence: high
- source_object: STORED PROCEDURE (Snowflake Scripting/JavaScript/Python)
  target_object: SQL stored procedure
  notes: ''
  claim:
    text: BigQuery supports SQL stored procedures.
    url: https://docs.cloud.google.com/bigquery/docs/procedures
    accessed: '2026-10-15'
    confidence: high
- source_object: TASK / task graph
  target_object: Scheduled query
  notes: ''
  claim:
    text: BigQuery scheduled queries run on a recurring basis.
    url: https://docs.cloud.google.com/bigquery/docs/scheduling-queries
    accessed: '2026-10-15'
    confidence: high
- source_object: STREAM
  target_object: Storage Write API / MERGE
  notes: ''
