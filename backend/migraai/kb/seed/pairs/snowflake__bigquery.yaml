- text: COPY INTO <location> unloads table or query data to files and supports PARTITION BY.
  url: https://docs.snowflake.com/en/sql-reference/sql/copy-into-location
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery batch loads support Avro, Parquet, ORC and other formats.
  url: https://docs.cloud.google.com/bigquery/docs/batch-loading-data
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery external data source tables keep metadata in BigQuery while data stays external.
  url: https://docs.cloud.google.com/bigquery/docs/external-data-sources
  accessed: '2026-10-15'
  confidence: high
- text: The BigQuery Data Transfer Service Snowflake connector schedules automated migrations from Snowflake.
