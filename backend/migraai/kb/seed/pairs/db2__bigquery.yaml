source: db2
target: bigquery
architecture_overview:
- text: A Db2 Warehouse MPP cluster scales out by adding data nodes with minimal interruption.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery is a fully managed, serverless data warehouse that separates storage and compute.
  url: https://cloud.google.com/bigquery/docs/introduction
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery stores table data in a columnar format.
  url: https://cloud.google.com/bigquery/docs/storage_overview
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Db2 CREATE TABLE has an ORGANIZE BY clause to choose column- or row-organized storage.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=statements-create-table
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery stores table data in a columnar format.
    url: https://cloud.google.com/bigquery/docs/storage_overview
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Db2 workload management uses DDL objects such as service classes, workloads, thresholds and work action sets.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=identification-workload-management-ddl-statements
    accessed: '2026-10-15'
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute queries.
    url: https://cloud.google.com/bigquery/docs/slots
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Db2 Warehouse row and column access control (RCAC) filters rows and masks columns per user as fine-grained access control.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=management-row-column-access-control-rcac
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery access is controlled with IAM roles and permissions on projects, datasets and tables.
    url: https://cloud.google.com/bigquery/docs/access-control
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: A Db2 Warehouse MPP cluster needs at least three nodes (one head, two data) and an SMP deployment cannot be turned into MPP by adding nodes.
    url: https://www.ibm.com/docs/en/db2-warehouse?topic=deployment-scaling-out
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery is a fully managed, serverless data warehouse that separates storage and compute.
    url: https://cloud.google.com/bigquery/docs/introduction
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Db2 Warehouse resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into BigQuery, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for BigQuery instead of copying Db2 Warehouse structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
