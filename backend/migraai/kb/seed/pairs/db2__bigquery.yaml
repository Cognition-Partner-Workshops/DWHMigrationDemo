sql_dialect_differences:
- text: Db2 Warehouse accepts the Oracle (+) outer join operator in WHERE predicates.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 Warehouse supports Oracle-style hierarchical (recursive) queries.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=compatibility-features-oracle
  accessed: '2026-10-15'
  confidence: high
- text: Db2 DECODE compares an expression with search values and returns the matching result.
  url: https://www.ibm.com/docs/en/db2-warehouse?topic=functions-decode
  accessed: '2026-10-15'
  confidence: high
- text: GoogleSQL query syntax includes a QUALIFY clause.
  url: https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery DML includes MERGE for combined insert, update and delete.
  url: https://cloud.google.com/bigquery/docs/reference/standard-sql/dml-syntax
  accessed: '2026-10-15'
  confidence: high
- text: GoogleSQL procedural language supports variables, IF, loops and exception handling in scripts.
  url: https://cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language
  accessed: '2026-10-15'
  confidence: high
