risks:
  sql:
    level: medium
    notes: T-SQL is shared, but dedicated pool lacks FK, triggers, sequences and caps procedure nesting at 8.
  data:
    level: medium
    notes: Distribution-key choice affects load and join performance; round-robin staging then re-hash is common.
  security:
    level: medium
    notes: SQL/Entra auth, TDE and CLS map directly; firewall rules at pool level.
  governance:
    level: low
    notes: Synapse workspace RBAC governs access; plan Purview if needed.
  platform:
    level: medium
    notes: DWU sizing and pause/resume replace instance tuning.
  operational:
    level: low
    notes: Monitor with DMVs and workload management.
