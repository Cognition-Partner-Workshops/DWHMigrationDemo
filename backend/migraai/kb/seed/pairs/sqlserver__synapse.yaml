  accessed: *id001
  confidence: high
- text: PolyBase with T-SQL commands can load data from Azure Blob Storage into dedicated SQL pool tables.
  url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-load-from-azure-blob-storage-with-polybase
  accessed: *id001
  confidence: high
- text: Change data capture uses SQL Server Agent to log inserts, updates and deletes on a table.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-data-capture-sql-server?view=sql-server-ver17
  accessed: *id001
  confidence: high
