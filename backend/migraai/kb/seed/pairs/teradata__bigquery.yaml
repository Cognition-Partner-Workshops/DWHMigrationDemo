source: teradata
target: bigquery
architecture_overview:
- text: Teradata PE and AMP vprocs share neither memory nor disk, giving a shared-nothing design.
  url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery is a fully managed, serverless data warehouse that separates storage and compute.
  url: https://cloud.google.com/bigquery/docs/introduction
  accessed: '2026-10-15'
  confidence: high
- text: BigQuery stores table data in a columnar format.
  url: https://cloud.google.com/bigquery/docs/storage_overview
  accessed: '2026-10-15'
  confidence: high
major_differences:
  storage:
  - text: Teradata row partitioning (PPI) enables row partition elimination for large query gains.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Primary-Index-Primary-AMP-Index-and-NoPI-Objects/Advantages-and-Disadvantages-of-Partitioned-Primary-Indexes
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery stores table data in a columnar format.
    url: https://cloud.google.com/bigquery/docs/storage_overview
    accessed: '2026-10-15'
    confidence: high
  compute:
  - text: Choosing primary indexes so joined rows hash to the same AMP avoids redistributing rows across the BYNET.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: A BigQuery slot is a virtual compute unit used to execute queries.
    url: https://cloud.google.com/bigquery/docs/slots
    accessed: '2026-10-15'
    confidence: high
  security:
  - text: Teradata row level security controls access per row and per SQL operation by comparing user and row security labels.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Security-Administration/Implementing-Row-Level-Security/Row-Level-Security
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery access is controlled with IAM roles and permissions on projects, datasets and tables.
    url: https://cloud.google.com/bigquery/docs/access-control
    accessed: '2026-10-15'
    confidence: high
  scalability:
  - text: Teradata balances work by spreading rows evenly across AMPs, each solely responsible for its own data.
    url: https://docs.teradata.com/r/Enterprise_IntelliFlex_VMware/Database-Design/Database-Design-for-Vantage/Data-Placement-to-Support-Parallel-Processing
    accessed: '2026-10-15'
    confidence: high
  - text: BigQuery is a fully managed, serverless data warehouse that separates storage and compute.
    url: https://cloud.google.com/bigquery/docs/introduction
    accessed: '2026-10-15'
    confidence: high
recommended_strategy: Start with an inventory from the Teradata resource catalog, then convert DDL and SQL with a translation tool where one exists and review the output by hand. Move data in bulk through cloud object storage into BigQuery, then load increments until cut-over. Re-design physical layout (distribution, partitioning, indexing) for BigQuery instead of copying Teradata structures, rewrite procedural code and security rules, and validate row counts and aggregates per table before switching consumers.
