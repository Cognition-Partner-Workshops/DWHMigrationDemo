risks:
  sql:
    level: high
    notes: T-SQL to PL/pgSQL conversion is the largest effort; SCT automates much but manual fixes remain.
  data:
    level: medium
    notes: Unenforced constraints can silently produce duplicates; validate counts and keys post-load.
  security:
    level: medium
    notes: RLS/DDM equivalents exist; Windows-integrated auth maps to IAM/IdP federated access.
  governance:
    level: low
    notes: Plan catalog/lineage outside the engine.
  platform:
    level: medium
    notes: 'MPP redesign: distribution/sort key choices drive performance.'
  operational:
    level: low
    notes: Serverless option reduces cluster management.
