source: sqlserver
target: redshift
architecture_overview:
- text: A page is a fundamental unit of data storage in the SQL Server Database Engine.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/pages-and-extents-architecture-guide?view=sql-server-ver17
  accessed: &id001 2026-10-15
  confidence: high
- text: A columnstore index stores, retrieves and manages data in a columnar format.
  url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: The core infrastructure component of Amazon Redshift is a cluster of one or more compute nodes, coordinated by a leader node.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
  accessed: *id001
  confidence: high
- text: Amazon Redshift is based on open standard PostgreSQL, so most SQL client applications work with minimal changes.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
  accessed: *id001
  confidence: high
major_differences:
  storage:
  - text: A clustered index sorts and stores table rows by its key values, and a table can have only one clustered index.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/clustered-and-nonclustered-indexes-described?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: With AUTO distribution, Amazon Redshift assigns an optimal distribution style based on the size of the table data.
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_choosing_dist_sort.html
    accessed: *id001
    confidence: high
  compute:
  - text: Resource governor manages Database Engine resource consumption and enforces policies for user workloads.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Automatic WLM manages the resources required to run concurrent queries in Amazon Redshift.
    url: https://docs.aws.amazon.com/redshift/latest/dg/cm-c-implementing-workload-management.html
    accessed: *id001
    confidence: high
  security:
  - text: Row-level security uses group membership or execution context to control access to table rows.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Redshift role-based access control (RBAC) applies the principle of least permissions through roles assigned to users.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_Roles.html
    accessed: *id001
    confidence: high
  - text: Row-level security policies in Redshift restrict access to particular rows of a table.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_rls.html
    accessed: *id001
    confidence: high
  scalability:
  - text: Partitioned table and index data is divided into units that can be spread across multiple filegroups or kept in one.
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17
    accessed: *id001
    confidence: high
  - text: Concurrency scaling lets Amazon Redshift support thousands of concurrent users and queries by adding cluster capacity automatically.
    url: https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html
    accessed: *id001
    confidence: high
  - text: Amazon Redshift Serverless automatically provisions and scales data warehouse capacity.
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-serverless.html
    accessed: *id001
    confidence: high
recommended_strategy: Use AWS SCT to assess and convert the SQL Server schema and T-SQL code to Redshift's PostgreSQL-derived dialect, then migrate data with AWS DMS (full load plus CDC) or bcp/UNLOAD via S3 and COPY. Rebuild SSIS logic in your target ETL tool and map logins/roles to Redshift RBAC.
object_mapping:
- source_object: Stored procedure (T-SQL)
  target_object: Stored procedure (PL/pgSQL)
  notes: Rewrite T-SQL procedures in PL/pgSQL.
  claim:
    text: Redshift CREATE PROCEDURE creates a new stored procedure or replaces an existing procedure for the database.
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_PROCEDURE.html
    accessed: *id001
    confidence: high
- source_object: Indexed view
  target_object: Materialized view
  notes: Redshift materialized views store precomputed results.
  claim:
    text: A materialized view in Redshift contains a precomputed result set based on an SQL query over base tables.
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-overview.html
    accessed: *id001
    confidence: high
- source_object: Trigger
  target_object: None — redesign
  notes: Redshift has no DML triggers; move logic into ETL.
  claim:
    text: Redshift CREATE PROCEDURE creates a new stored procedure or replaces an existing procedure for the database.
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_PROCEDURE.html
    accessed: *id001
    confidence: high
- source_object: MERGE statement
  target_object: MERGE (or REMOVE DUPLICATES)
  notes: Redshift MERGE supports matched/not-matched plus dedupe.
  claim:
    text: Amazon Redshift MERGE combines insert, update and delete operations on a target table, including a REMOVE DUPLICATES mode.
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_MERGE.html
    accessed: *id001
    confidence: high
- source_object: Table with clustered index
  target_object: Table with distribution and sort keys
  notes: Physical ordering is governed by sort keys, not indexes.
  claim:
    text: Redshift stores columnar data in 1 MB disk blocks and sorts rows by SORTKEY so range-restricted predicates can use block min/max metadata.
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_Sorting_data.html
    accessed: *id001
    confidence: high
sql_dialect_differences:
- text: TOP limits the rows returned by a query to a number or percentage of rows.
  url: https://learn.microsoft.com/en-us/sql/t-sql/queries/top-transact-sql?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: MERGE runs insert, update or delete operations on a target table from a join with a source table.
  url: https://learn.microsoft.com/en-us/sql/t-sql/statements/merge-transact-sql?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: Amazon Redshift MERGE combines insert, update and delete operations on a target table, including a REMOVE DUPLICATES mode.
  url: https://docs.aws.amazon.com/redshift/latest/dg/r_MERGE.html
  accessed: *id001
  confidence: high
- text: A common table expression (CTE) is a temporary named result set defined with WITH.
  url: https://learn.microsoft.com/en-us/sql/t-sql/queries/with-common-table-expression-transact-sql?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: TRY...CATCH implements error handling in T-SQL.
  url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/try-catch-transact-sql?view=sql-server-ver17
  accessed: *id001
  confidence: high
- text: Amazon Redshift is based on open standard PostgreSQL, so most SQL client applications work with minimal changes.
  url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
  accessed: *id001
