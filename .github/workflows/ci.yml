name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --project backend --group dev
      - run: uv run --project . --group dev ruff check migraai tests
        working-directory: backend
      - run: uv run --project . --group dev ruff format --check migraai tests
        working-directory: backend
      - run: uv run --project . --group dev pytest -q
        working-directory: backend
        env:
          MIGRAAI_GOLDEN_FAILURE_DIR: ${{ runner.temp }}/backend-golden-failure-artifacts
      - run: uv run --project . --group dev python -m migraai.kb.validate --allow-incomplete
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-golden-failure-output-${{ matrix.os }}
          path: ${{ runner.temp }}/backend-golden-failure-artifacts/
          if-no-files-found: ignore

  golden:
    runs-on: ubuntu-latest
    env:
      MIGRAAI_GOLDEN_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --project backend --group dev
      - run: uv run --project . --group dev pytest -q tests/golden/test_testpacks.py
        working-directory: backend
      - name: Run the conversion matrix in pair shards
        shell: bash
        env:
          MIGRAAI_GOLDEN_FAILURE_DIR: ${{ runner.temp }}/golden-failure-artifacts
        run: |
          set -e
          for source in teradata oracle sqlserver snowflake synapse db2 hive netezza; do
            for target in databricks redshift snowflake fabric bigquery synapse clickhouse; do
              MIGRAAI_GOLDEN_SOURCE="$source" MIGRAAI_GOLDEN_TARGET="$target" uv run --project . --group dev pytest -q tests/golden/test_conversion_matrix.py
            done
          done
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failure-output
          path: ${{ runner.temp }}/golden-failure-artifacts/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --project backend --group dev
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  portable:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install uv
      - run: uv sync --project backend --group dev
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run --project backend python packaging/windows/build_portable.py
      - name: Check portable DLL dependencies
        run: >-
          uv run --project backend --with pefile==2024.8.26 python
          packaging/windows/check_dll_deps.py packaging/windows/out/MigraAI
      - name: Smoke test portable app
        shell: pwsh
        run: |
          $app = Resolve-Path "packaging/windows/out/MigraAI"
          $python = Join-Path $app "python/python.exe"
          $web = Join-Path $app "web"
          $env:HF_HUB_OFFLINE = "1"
          $env:MIGRAAI_MODEL_DIR = Join-Path $app "app/models"
          $env:MIGRAAI_SEED_KB = Join-Path $app "app/kb/kb-v1.db"
          $env:MIGRAAI_DEV_TOKEN = "portable-smoke-token"
          $process = Start-Process -FilePath $python -ArgumentList @("-m","migraai","--no-browser","--port","8765","--web-dir",$web) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/api/health"
                if ($health.status -eq "ready") { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Portable app health check did not become ready." }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest "http://127.0.0.1:8765/api/auth/launch?token=portable-smoke-token" -WebSession $session | Out-Null
            $search = Invoke-WebRequest "http://127.0.0.1:8765/api/kb/search?q=data%20types&source=teradata&target=snowflake" -WebSession $session
            if ($search.StatusCode -ne 200) { throw "KB search smoke test failed: $($search.StatusCode)" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: migraai-portable-windows
          path: packaging/windows/out/MigraAI-portable-*-win64.zip

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sonar-config
        name: Check scan configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.sonar-config.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
