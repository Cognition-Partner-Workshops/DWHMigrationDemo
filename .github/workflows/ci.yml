name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --project backend --group dev
      - run: uv run --project . --group dev ruff check migraai tests
        working-directory: backend
      - run: uv run --project . --group dev ruff format --check migraai tests
        working-directory: backend
      - run: uv run --project . --group dev pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  portable:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install uv
      - run: uv sync --project backend --group dev
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python packaging/windows/build_portable.py
      - name: Smoke test portable app
        shell: pwsh
        run: |
          $app = Resolve-Path "packaging/windows/out/MigraAI"
          $python = Join-Path $app "python/python.exe"
          $web = Join-Path $app "web"
          $process = Start-Process -FilePath $python -ArgumentList @("-m","migraai","--no-browser","--port","8765","--web-dir",$web) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/api/health"
                if ($health.status -eq "ready") { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Portable app health check did not become ready." }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: migraai-portable-windows
          path: packaging/windows/out/MigraAI-portable-*-win64.zip

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sonar-config
        name: Check scan configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.sonar-config.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
